function gaugeSVG(pct, color, size, stroke){
  size = size || 132; stroke = stroke || 10;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (Math.max(2,pct)/100) * c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(255,255,255,0.08)" stroke-width="${stroke}" fill="none"/>
    <circle class="gauge-arc" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}"
      style="--gauge-target:${offset}; stroke:${color};"/>
  </svg>`;
}
function trendChartSVG(history){
  const w = 560, h = 140, pad = 24;
  const points = (history||[]).slice(-30);
  if(points.length < 2){
    return `<div style="font-size:13px;color:var(--text-faint); padding:12px 0;">Not enough history yet — the trend line appears after a couple of saves.</div>`;
  }
  const maxScore = 100;
  const stepX = points.length > 1 ? (w - pad*2) / (points.length - 1) : 0;
  const coords = points.map((p,i) => {
    const x = pad + i*stepX;
    const y = h - pad - (p.score/maxScore)*(h - pad*2);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  let pathLen = 0;
  for(let i=1;i<coords.length;i++){
    const dx = coords[i][0]-coords[i-1][0], dy = coords[i][1]-coords[i-1][1];
    pathLen += Math.sqrt(dx*dx + dy*dy);
  }
  const first = points[0];
  const last = points[points.length-1];
  const trendColor = last.score >= first.score ? 'var(--green)' : 'var(--red)';
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
      <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <path class="chart-line" d="${path}" fill="none" stroke="${trendColor}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        style="--path-len:${pathLen.toFixed(1)};"/>
      ${coords.map((c,i)=>`<circle class="chart-dot" cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="${trendColor}" style="animation-delay:${Math.min(i*18,500)}ms;"/>`).join('')}
    </svg>
    <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-faint); margin-top:4px;">
      <span>${new Date(first.t).toLocaleDateString()}</span>
      <span>${new Date(last.t).toLocaleDateString()}</span>
    </div>`;
}
function recordScoreHistoryPoint(){
  const stats = computeVaultStats();
  if(!state.scoreHistory) state.scoreHistory = [];
  state.scoreHistory.push({t: Date.now(), score: stats.avgScore});
  if(state.scoreHistory.length > 60) state.scoreHistory.splice(0, state.scoreHistory.length - 60);
}

async function renderLockScreen(errorMsg){
  const el = document.getElementById('lock-screen');
  const users = await listUsers();

  if(state.lockView === 'reset' && users.length > 0){
    return renderResetScreen(el, state.pendingUsername || '', errorMsg);
  }
  if(state.lockView === 'unlock'){
    return renderUnlockScreen(el, state.pendingUsername || '', errorMsg);
  }
  if(state.lockView === 'create' || users.length === 0){
    return renderCreateAccountScreen(el, users, errorMsg);
  }
  if(state.lockView === 'picker'){
    return renderAccountPicker(el, users, errorMsg);
  }
  return renderUnlockScreen(el, state.pendingUsername || (users.length === 1 ? users[0].username : ''), errorMsg);
}

function renderAccountPicker(el, users, errorMsg){
  const initialsOf = (name) => (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  el.innerHTML = lockCardShell(`
    <h2 style="text-align:center; font-size:19px; margin-bottom:6px;">Who's signing in?</h2>
    <p style="text-align:center; font-size:13px; color:var(--text-faint); margin-bottom:20px;">

    ${errorMsg ? `<div class="lock-error">${esc(errorMsg)}</div>` : ''}
    <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:18px;">
      ${users.map(u => `
        <div style="display:flex; align-items:stretch; gap:6px;">
          <button class="btn" data-user="${esc(u.username)}" style="flex:1; min-width:0; justify-content:flex-start; padding:12px 14px; text-align:left;">
            <span class="entry-avatar picker-avatar" style="margin-right:2px;">${esc(initialsOf(u.displayName || u.username))}</span>
            <span style="flex:1; min-width:0;">
              <div style="font-weight:600; font-size:14px;">${esc(u.displayName || u.username)}</div>
              <div style="font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono);">@${esc(u.username)}</div>
            </span>
          </button>
          <button type="button" class="icon-btn" data-remove-user="${esc(u.username)}" title="Remove this account from this device" style="flex-shrink:0; border:1px solid var(--border); border-radius:10px; color:var(--text-faint);">${svgTrash(15)}</button>
        </div>
      `).join('')}
    </div>
    <button class="btn btn-primary btn-block" id="new-account-btn" style="padding:12px;">${svgPlus(15)} Add account</button>
    <p class="lock-note">${svgKey(11)}&nbsp; AES‑256‑GCM · PBKDF2‑SHA256 (250,000 rounds) per account · zero‑knowledge — nothing here can decrypt an account without that account's own password.</p>
  `);
  el.querySelectorAll('[data-user]').forEach(btn => {
    btn.onclick = () => {
      state.lockView = 'unlock';
      state.pendingUsername = btn.dataset.user;
      renderLockScreen();
    };
  });
  el.querySelectorAll('[data-remove-user]').forEach(btn => {
    btn.onclick = async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const username = btn.dataset.removeUser;
      if(confirm(`Remove @${username} from this device and permanently delete its vault? This cannot be undone.`)){
        await wipeVault(username);
        renderLockScreen();
      }
    };
  });
  document.getElementById('new-account-btn').onclick = () => {
    state.lockView = 'create';
    renderLockScreen();
  };
}

function renderUnlockScreen(el, username, errorMsg){
  el.innerHTML = lockCardShell(`
    ${scanRingHTML(40)}
    <h2 style="text-align:center; font-size:19px; margin-bottom:6px;">Log in</h2>
    <p style="text-align:center; font-size:13px; color:var(--text-faint); margin-bottom:22px;">Enter your username and master password to decrypt your data locally.</p>
    ${errorMsg ? `<div class="lock-error">${esc(errorMsg)}</div>` : ''}
    <form id="unlock-form">
      <div class="field">
        <label>Username</label>
        <div class="input-wrap"><span class="field-icon-left">${svgUser(15)}</span><input type="text" class="has-icon" id="unlock-username" autocomplete="username" value="${esc(username)}" required /></div>
      </div>
      <div class="field">
        <label>Master password</label>
        <div class="input-wrap">
          <span class="field-icon-left">${svgKey(15)}</span>
          <input type="password" class="has-icon" id="pw1" autocomplete="current-password" placeholder="••••••••••••" required autofocus />
          <button type="button" class="reveal-toggle" id="toggle-pw1">${svgEye(16)}</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px; padding:13px;">${svgLock(16)} Unlock vault</button>
    </form>
    <div class="lock-switch"><button id="reset-vault-btn" class="danger-muted">Forgot your password?</button></div>
    <div class="lock-switch">Don't have an account? <button id="go-create-btn">Create account</button></div>
    <div class="lock-switch" style="font-size:12px;"><button id="back-to-picker-btn">Switch account</button></div>
    <p class="lock-note">${svgKey(11)}&nbsp; This account's key is derived only from this password, right now, in this browser. No other account or admin path exists.</p>
  `);
  focusSoon(username ? 'pw1' : 'unlock-username');
  document.getElementById('toggle-pw1').onclick = () => togglePw('pw1','toggle-pw1');
  const pickerBtn = document.getElementById('back-to-picker-btn');
  if(pickerBtn) pickerBtn.onclick = () => {
    state.lockView = 'picker'; state.pendingUsername = null; renderLockScreen();
  };
  const goCreateBtn = document.getElementById('go-create-btn');
  if(goCreateBtn) goCreateBtn.onclick = () => {
    state.lockView = 'create'; renderLockScreen();
  };
  document.getElementById('unlock-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const typedUsername = normalizeUsername(document.getElementById('unlock-username').value);
    const pw1 = document.getElementById('pw1').value;
    const submitBtn = e.target.querySelector('button[type=submit]');
    submitBtn.disabled = true;
    const originalLabel = submitBtn.innerHTML;
    submitBtn.innerHTML = `${svgSpinner(16)} Decrypting…`;
    try{
      if(!(await accountExists(typedUsername))) throw new Error('NO_SUCH_ACCOUNT');
      const { key, vaults } = await unlockVault(typedUsername, pw1);
      const users = await listUsers();
      const rec = users.find(u => u.username === typedUsername);
      state.key = key; state.vaults = vaults; state.activeVaultIndex = 0;
      state.entries = state.vaults[0].entries; state.scoreHistory = state.vaults[0].scoreHistory || [];
      state.trash = state.vaults[0].trash || [];
      state.unlocked = true; state.username = typedUsername;
      state.displayName = (rec && rec.displayName) || typedUsername;
      recordLoginActivity();
      await savePrefs(state.prefs);
      renderApp();
    }catch(err){
      console.error('SecureSpace error:', err);
      let msg = 'Something went wrong: ' + (err && err.message ? err.message : 'unknown error') + '.';
      if(err.message === 'WRONG_PASSWORD') msg = 'Incorrect master password.';
      if(err.message === 'NO_SUCH_ACCOUNT') msg = `No account named @${typedUsername} on this device.`;
      state.pendingUsername = typedUsername;
      renderUnlockScreen(el, typedUsername, msg);
    }finally{
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalLabel;
    }
  });
  document.getElementById('reset-vault-btn').onclick = () => {
    // Carry whatever was typed in the username box over to the reset screen.
    state.pendingUsername = normalizeUsername(document.getElementById('unlock-username').value) || username || '';
    state.lockView = 'reset';
    renderLockScreen();
  };
}

/* Reset-password screen: proves possession of the recovery key, which
   decrypts the old master password; the vault is then unlocked with it and
   re-encrypted under the new password (with a fresh recovery key). */

  el.innerHTML = lockCardShell(`
    ${scanRingHTML(120)}
    <h2 style="text-align:center; font-size:19px; margin-bottom:6px;">Reset your password</h2>
    <p style="text-align:center; font-size:13px; color:var(--text-faint); margin-bottom:22px;">Enter the recovery key you saved when you created your account (or last generated one), then choose a new master password.</p>

    <form id="reset-form">
      <div class="field">
        <label>Username</label>
        <div class="input-wrap"><span class="field-icon-left">${svgUser(15)}</span><input type="text" class="has-icon" id="reset-username" autocomplete="username" value="${esc(username)}" required /></div>
      </div>
      <div class="field">
        <label>Recovery key</label>
        <div class="input-wrap"><span class="field-icon-left">${svgKey(15)}</span><input type="text" class="has-icon" id="reset-recovery" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" spellcheck="false" autocapitalize="characters" required /></div>
      </div>
      <div class="field">
        <label>New master password</label>
        <div class="input-wrap">
          <span class="field-icon-left">${svgKey(15)}</span>
          <input type="password" class="has-icon" id="reset-pw1" autocomplete="new-password" placeholder="••••••••••••" required />
          <button type="button" class="reveal-toggle" id="toggle-reset-pw1">${svgEye(16)}</button>
        </div>
        <div class="mini-strength" id="reset-strength" style="display:none;">
          <div class="strength-track"><div class="strength-fill" id="rs-fill" style="width:0%"></div></div>
          <div class="strength-label-row"><span id="rs-label">—</span><span id="rs-entropy"></span></div>
        </div>
      </div>
      <div class="field">
        <label>Confirm new password</label>
        <div class="input-wrap">
          <span class="field-icon-left">${svgKey(15)}</span>
          <input type="password" class="has-icon" id="reset-pw2" autocomplete="new-password" placeholder="••••••••••••" required />
          <button type="button" class="reveal-toggle" id="toggle-reset-pw2">${svgEye(16)}</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px; padding:13px;">${svgLock(16)} Reset password</button>
    </form>
    <div class="lock-switch"><button id="reset-back-btn">← Back to log in</button></div>
    <div class="lock-switch" style="font-size:12px;"><button id="erase-account-btn" class="danger-muted">No recovery key? Erase this account instead</button></div>
    <p class="lock-note">${svgKey(11)}&nbsp; The recovery key never leaves this browser. Resetting issues you a new recovery key; the old one stops working.</p>
  `);
  focusSoon(username ? 'reset-recovery' : 'reset-username');
  document.getElementById('toggle-reset-pw1').onclick = () => togglePw('reset-pw1','toggle-reset-pw1');
  document.getElementById('toggle-reset-pw2').onclick = () => togglePw('reset-pw2','toggle-reset-pw2');
  document.getElementById('reset-back-btn').onclick = () => {
    state.pendingUsername = normalizeUsername(document.getElementById('reset-username').value) || username || '';
    state.lockView = 'login';
    renderLockScreen();
  };
  document.getElementById('erase-account-btn').onclick = async () => {
    const targetUsername = normalizeUsername(document.getElementById('reset-username').value) || username;
    if(!targetUsername){ renderResetScreen(el, '', 'Enter the username of the account to erase.'); return; }
    if(confirm(`This permanently deletes @${targetUsername}'s vault and cannot be undone. Continue?`)){
      await wipeVault(targetUsername);
      state.lockView = 'login'; state.pendingUsername = null;
      renderLockScreen();
    }
  };
  const rsPw1 = document.getElementById('reset-pw1');
  rsPw1.addEventListener('input', () => {
    const box = document.getElementById('reset-strength');
    if(!rsPw1.value){ box.style.display = 'none'; return; }
    box.style.display = 'block';
    const r = analyzePassword(rsPw1.value);
    document.getElementById('rs-fill').style.width = r.score + '%';
    document.getElementById('rs-fill').style.background = r.color;
    document.getElementById('rs-label').textContent = r.label;
    document.getElementById('rs-entropy').textContent = r.entropy + ' bits';
  });

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const typedUsername = normalizeUsername(document.getElementById('reset-username').value);
    const recoveryInput = document.getElementById('reset-recovery').value;
    const n1 = document.getElementById('reset-pw1').value;
    const n2 = document.getElementById('reset-pw2').value;
    const submitBtn = e.target.querySelector('button[type=submit]');
    submitBtn.disabled = true;
    const originalLabel = submitBtn.innerHTML;
    submitBtn.innerHTML = `${svgSpinner(16)} Resetting…`;
    try{
      if(!typedUsername) throw new Error('BAD_USERNAME');
      if(!(await accountExists(typedUsername))) throw new Error('NO_SUCH_ACCOUNT');
      if(n1.length < 8) throw new Error('WEAK');
      if(n1 !== n2) throw new Error('MISMATCH');
      const metaRes = await storageAPI.get(metaKeyFor(typedUsername));
      const meta = JSON.parse(metaRes.value);
      if(!meta.recovery) throw new Error('NO_RECOVERY');
      if(!normalizeRecoveryKey(recoveryInput)) throw new Error('BAD_RECOVERY');
      let oldPassword;
      try{ oldPassword = await openRecoveryBlob(recoveryInput, meta.recovery); }
      catch(decErr){ throw new Error('BAD_RECOVERY'); }
      const { vaults } = await unlockVault(typedUsername, oldPassword);
      const { key, recoveryKey } = await changeMasterPassword(typedUsername, vaults, n1);
      // Show the replacement recovery key before entering the app.
      await showRecoveryKeyModal(recoveryKey, typedUsername);
      const users = await listUsers();
      const rec = users.find(u => u.username === typedUsername);
      state.key = key; state.vaults = vaults; state.activeVaultIndex = 0;
      state.entries = state.vaults[0].entries; state.scoreHistory = state.vaults[0].scoreHistory || [];
      state.trash = state.vaults[0].trash || [];
      state.unlocked = true; state.username = typedUsername;
      state.displayName = (rec && rec.displayName) || typedUsername;
      state.pendingUsername = null;
      recordLoginActivity();
      await savePrefs(state.prefs);
      showToast('Password reset', svgLock(14));
      renderApp();
    }catch(err){
      console.error('SecureSpace error:', err);
      let msg = 'Something went wrong: ' + (err && err.message ? err.message : 'unknown error') + '.';
      if(err.message === 'BAD_USERNAME') msg = 'Enter your username.';
      if(err.message === 'NO_SUCH_ACCOUNT') msg = `No account named @${typedUsername} on this device.`;
      if(err.message === 'WEAK') msg = 'Use at least 8 characters for your new master password.';
      if(err.message === 'MISMATCH') msg = 'Passwords do not match.';
      if(err.message === 'NO_RECOVERY') msg = 'This account has no recovery key.';
      if(err.message === 'BAD_RECOVERY') msg = 'Incorrect recovery key.';
      if(err.message === 'WRONG_PASSWORD') msg = 'Incorrect recovery key.';
      state.pendingUsername = typedUsername;
      renderResetScreen(el, typedUsername, msg);
    }finally{
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalLabel;
    }
  });
}

function togglePw(inputId, btnId){

/* ---------------- "Save your recovery key" modal ----------------
   Rendered into its own body-level container (not #modal-root) so Escape
   and overlay clicks can't dismiss it — the only way forward is ticking
   "I saved my recovery key" and pressing Continue. Returns a promise that
   resolves once the user continues (or the container is torn down by
   lockNow via _cleanup). */
function showRecoveryKeyModal(recoveryKey, username){
  return new Promise((resolve) => {
    const prev = document.getElementById('recovery-container');
    if(prev) prev.remove();
    const container = document.createElement('div');
    container.id = 'recovery-container';
    container.innerHTML = `
      <div class="modal-overlay" id="recovery-overlay" style="z-index:80;">
        <div class="modal" style="max-width:460px;">
          <div class="modal-head"><h3>Save your recovery key</h3></div>
          <p style="font-size:12.5px; color:var(--text-faint); margin-bottom:14px; line-height:1.55;">
            If you forget your master password, this key is the only way to reset it. It is shown once, so save it now somewhere safe and offline. Anyone who has it can reset this account's password on this device. Any older recovery key no longer works.
          </p>
          <div class="recovery-key-box" id="recovery-key-text">${esc(recoveryKey)}</div>
          <div style="display:flex; gap:8px; margin-bottom:16px;">
            <button type="button" class="btn btn-sm" id="recovery-copy-btn" style="flex:1;">${svgCopy(14)} Copy</button>
            <button type="button" class="btn btn-sm" id="recovery-download-btn" style="flex:1;">${svgDownload(14)} Download .txt</button>
          </div>
          <div style="margin-bottom:16px;">
            <div style="display:flex; gap:8px;">
              <div class="field" style="flex:1; min-width:0; margin:0;"><input type="email" id="recovery-email-input" placeholder="you@example.com" autocomplete="email" aria-label="Email address for the recovery key (optional)"></div>
              <button type="button" class="btn btn-sm" id="recovery-email-btn">Email it</button>
            </div>
            <div id="recovery-email-error" class="lock-error" style="display:none; margin-top:8px;"></div>
            <p style="font-size:11.5px; color:var(--text-faint); margin-top:6px; line-height:1.5;">Opens your mail app with the key filled in. Emailing a key is less secure than writing it down — delete the email once saved.</p>
          </div>
          <label class="recovery-confirm"><input type="checkbox" id="recovery-confirm-check"> I saved my recovery key</label>
          <button type="button" class="btn btn-primary btn-block" id="recovery-continue-btn" disabled>Continue</button>
        </div>
      </div>`;
    document.body.appendChild(container);
    container._cleanup = () => resolve();
    document.getElementById('recovery-copy-btn').onclick = () => {
      navigator.clipboard.writeText(recoveryKey)
        .then(() => showToast('Recovery key copied'))
        .catch(() => showToast('Could not copy — select the key and copy it manually'));
    };
    document.getElementById('recovery-download-btn').onclick = () => {
      const text =
        `SecureSpace recovery key\n\n` +
        `Account: @${username}\n` +
        `Recovery key: ${recoveryKey}\n` +
        `Created: ${new Date().toLocaleString()}\n\n` +
        `Use this on the "Forgot your password?" screen to reset your master password.\n` +
        `Keep this file somewhere safe and offline. Anyone with this key can reset the password of this account on the device holding its data.\n` +
        `Generating a new recovery key or changing your master password makes this key stop working.\n`;
      downloadBlob(new Blob([text], {type:'text/plain'}), `securespace-${username}-recovery-key.txt`);
    };
    const emailInput = document.getElementById('recovery-email-input');
    const emailBtn = document.getElementById('recovery-email-btn');
    const emailErr = document.getElementById('recovery-email-error');
    const showEmailErr = (msg) => {
      if(!emailErr) return;
      emailErr.textContent = msg || '';
      emailErr.style.display = msg ? '' : 'none';
    };
    if(emailInput) emailInput.oninput = () => showEmailErr('');
    if(emailBtn) emailBtn.onclick = () => {
      const addr = emailInput ? emailInput.value.trim() : '';
      if(!/^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]+$/.test(addr)){
        showEmailErr(addr ? 'Enter a valid email address.' : 'Enter your email address first.');
        return;
      }
      showEmailErr('');
      const subject = `SecureSpace recovery key for @${username}`;
      const body = 'Your SecureSpace recovery key:\n\n' + recoveryKey +
        '\n\nKeep this email private. Anyone with this key and access to your browser data can reset your master password. Delete this email once the key is stored somewhere safe.';
      window.location.href = `mailto:${encodeURIComponent(addr)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    };
    const check = document.getElementById('recovery-confirm-check');
    const contBtn = document.getElementById('recovery-continue-btn');
    check.onchange = () => { contBtn.disabled = !check.checked; };
    contBtn.onclick = () => {
      if(!check.checked) return;
      container.remove();
      resolve();
    };
  });
}

/* Asks for the current master password (verified through unlockVault), then
   issues a brand-new recovery key and shows it. Used by Settings. */
function openRegenerateRecoveryModal(onDone){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="recpw-overlay">
      <div class="modal" style="max-width:380px;">
        <div class="modal-head"><h3>Generate new recovery key</h3><button class="icon-btn" id="recpw-close">${svgX(16)}</button></div>
        <p style="font-size:12.5px;color:var(--text-faint);margin-bottom:14px;">Enter your current master password to confirm. Your existing recovery key (if any) will stop working.</p>
        <div id="recpw-error" class="lock-error" style="display:none;"></div>
        <form id="recpw-form">
          <div class="field"><input type="password" id="recpw-input" placeholder="Current master password" autocomplete="current-password" required></div>
          <button type="submit" class="btn btn-primary btn-block">Generate new recovery key</button>
        </form>
      </div>
    </div>`;
  focusSoon('recpw-input');
  const close = () => { root.innerHTML = ''; };
  document.getElementById('recpw-close').onclick = close;
  document.getElementById('recpw-overlay').addEventListener('click',(e)=>{ if(e.target.id==='recpw-overlay') close(); });
  document.getElementById('recpw-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('recpw-input').value;
    const errEl = document.getElementById('recpw-error');
    const submitBtn = e.target.querySelector('button[type=submit]');
    errEl.style.display = 'none';
    submitBtn.disabled = true;
    const originalLabel = submitBtn.innerHTML;
    submitBtn.innerHTML = `${svgSpinner(16)} Working…`;
    try{
      await unlockVault(state.username, pw); // throws WRONG_PASSWORD if incorrect
      const recoveryKey = await regenerateRecoveryKey(state.username, pw);
      close();
      await showRecoveryKeyModal(recoveryKey, state.username);
      if(onDone) onDone();
    }catch(err){
      console.error('SecureSpace error:', err);
      errEl.textContent = err && err.message === 'WRONG_PASSWORD'
        ? 'Incorrect master password.'
        : 'Something went wrong: ' + (err && err.message ? err.message : 'unknown error') + '.';
      errEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalLabel;
    }
  });
}

/* Removes every open dialog — the shared #modal-root plus any body-level
   containers (service picker, QR scanner) — stopping camera streams, so
   no plaintext can linger on screen after locking. */

  const root = document.getElementById('modal-root');

    const c = document.getElementById(id);
    if(!c) return;
    if(typeof c._cleanup === 'function') c._cleanup();
    c.remove();

function lockNow(){
  clearTimeout(renderSidebar._navTimer);
  closeAllModals();
  state.unlocked = false; state.key = null; state.vaults = []; state.activeVaultIndex = 0;
  state.entries = []; state.scoreHistory = []; state.trash = []; state.username = null; state.displayName = null;
  state.lockView = 'login'; state.pendingUsername = null; state.revealUnlockUntil = 0;
  state.view = 'vault'; state.search = ''; state.filterTag = ''; state.categoryFilter = ''; state.weakOnly = false;
  const mainEl = document.getElementById('main'); if(mainEl) mainEl.innerHTML = '';
  const sideEl = document.getElementById('sidebar'); if(sideEl){ sideEl.innerHTML = ''; sideEl.classList.remove('open'); }

/* ---------------- Vault view ---------------- */
function computeVaultStats(){
  const n = state.entries.length;
  const loginEntries = state.entries.filter(e => (e.type||'login') === 'login');
  let weak = 0, avgScore = 0;
  loginEntries.forEach(e => {
    const r = analyzePassword(e.password, [e.title, e.username]);
    if(r.label === 'Very Weak' || r.label === 'Weak') weak++;
    avgScore += r.score;
  });
  avgScore = loginEntries.length ? Math.round(avgScore/loginEntries.length) : 0;
  return { n, weak, avgScore };
}

/* ---------------- Password expiration ----------------
   Every login entry tracks when its password was last changed and, from
   that, how old it is. Expiry is a reminder, not an enforcement — nothing
   locks you out of an "expired" password, it just gets flagged so old
   credentials don't get forgotten about. Each entry can use the vault-
   wide default period (Settings) or set its own override, including
   "never expires" for things like a hardware key PIN. */
/* Password age is tracked by passwordUpdatedAt (set on add and whenever the
   password changes). Older entries predate that field, so fall back to
   updatedAt, then createdAt. updatedAt itself still moves on every edit
   and is only used for the "recently updated" sort. */
function passwordChangedAt(entry){
  return entry.passwordUpdatedAt || entry.updatedAt || entry.createdAt || Date.now();
}
function daysOld(entry){
  const base = passwordChangedAt(entry);
  return Math.max(0, Math.floor((Date.now() - base) / (24*60*60*1000)));
}
function getEffectiveExpiryDays(entry){
  if(entry.expiryDays === 0) return 0; // explicit "never expires" on this entry
  if(entry.expiryDays) return entry.expiryDays;
  return state.prefs.passwordExpiryDays || 0;
}
function expiryStatus(entry){
  const age = daysOld(entry);
  const expiry = getEffectiveExpiryDays(entry);
  if(!expiry) return { state:'none', age, expiry, daysLeft:null };
  const daysLeft = expiry - age;
  if(daysLeft < 0) return { state:'expired', age, expiry, daysLeft };
  if(daysLeft <= 14) return { state:'soon', age, expiry, daysLeft };
  return { state:'ok', age, expiry, daysLeft };
}
function expiryBadgeHTML(status){
  if(status.state === 'expired') return `<span class="badge" style="color:var(--red); background:rgba(251,113,133,0.12);">${svgAlert(10)} Expired ${Math.abs(status.daysLeft)}d ago</span>`;
  if(status.state === 'soon') return `<span class="badge" style="color:var(--amber); background:rgba(245,185,77,0.12);">Expires in ${status.daysLeft}d</span>`;
  return '';
}

const CATEGORIES = ['Social','Banking','Work','Personal','Shopping','Entertainment','Crypto'];
const CATEGORY_COLORS = {
  Social: '#9b8cff',
  Banking: '#4ade80',
  Work: '#5eead4',
  Personal: '#f5b94d',
  Shopping: '#fb7185',
  Entertainment: '#60a5fa',
  Crypto: '#fbbf24',
};
const QUICK_TAGS = ['important','favourite','shared','personal','work','critical'];

function getAllTags(){
  const set = new Set();
  state.entries.forEach(e => (e.tags||'').split(',').map(t=>t.trim()).filter(Boolean).forEach(t=>set.add(t)));
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}

function sortEntries(list){
  const arr = list.slice();
  if(state.sort === 'strength'){
    arr.sort((a,b)=> analyzePassword(a.password,[a.title,a.username]).score - analyzePassword(b.password,[b.title,b.username]).score);
  } else if(state.sort === 'recent'){
    arr.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
  } else if(state.sort === 'oldest'){
    arr.sort((a,b)=> (a.updatedAt||0) - (b.updatedAt||0));
  } else {
    arr.sort((a,b)=> (a.title||'').localeCompare(b.title||''));
  }
  return arr;
}

function computeVaultList(){
  const q = state.search.trim().toLowerCase();
  let list = state.entries.filter(e =>
    !q || (e.title||'').toLowerCase().includes(q) || (e.username||'').toLowerCase().includes(q) || (e.tags||'').toLowerCase().includes(q)
  );
  if(state.filterTag){
    list = list.filter(e => (e.tags||'').split(',').map(t=>t.trim()).includes(state.filterTag));
  }
  if(state.categoryFilter){
    list = list.filter(e => (e.category||'') === state.categoryFilter);
  }
  if(state.weakOnly){
    list = list.filter(e => (e.type||'login') === 'login' && ['Very Weak','Weak'].includes(analyzePassword(e.password,[e.title,e.username]).label));
  }
  const sorted = sortEntries(list);
  const pinned = sorted.filter(e => e.pinned);
  const rest = sorted.filter(e => !e.pinned);
  return pinned.concat(rest);
}

/* When no single category is selected, the vault renders as sections —
   Pinned first, then each category in a fixed order, then anything
   uncategorized — instead of one long undifferentiated list. Picking a
   specific category in the filter falls back to the flat list above,
   restricted to just that category. */
function computeGroupedVault(){
  const q = state.search.trim().toLowerCase();
  let list = state.entries.filter(e =>
    !q || (e.title||'').toLowerCase().includes(q) || (e.username||'').toLowerCase().includes(q) || (e.tags||'').toLowerCase().includes(q)
  );
  if(state.filterTag){
    list = list.filter(e => (e.tags||'').split(',').map(t=>t.trim()).includes(state.filterTag));
  }
  if(state.weakOnly){
    list = list.filter(e => (e.type||'login') === 'login' && ['Very Weak','Weak'].includes(analyzePassword(e.password,[e.title,e.username]).label));
  }
  const sorted = sortEntries(list);
  const pinned = sorted.filter(e => e.pinned);
  const rest = sorted.filter(e => !e.pinned);
  const groups = [];
  if(pinned.length) groups.push({ name: 'Pinned', items: pinned, color: 'var(--amber)' });
  CATEGORIES.forEach(cat => {
    const items = rest.filter(e => e.category === cat);
    if(items.length) groups.push({ name: cat, items, color: CATEGORY_COLORS[cat] });
  });
  const uncategorized = rest.filter(e => !e.category || !CATEGORIES.includes(e.category));
  if(uncategorized.length) groups.push({ name: 'Uncategorized', items: uncategorized, color: null });
  return groups;
}
function entryGridOrEmpty(list){
  return list.length === 0 ? emptyStateHTML(state.search.trim().toLowerCase()) : list.map(entryCardHTML).join('');
}
function vaultContentHTML(){
  if(state.categoryFilter){
    return `<div class="entry-grid" id="entry-grid">${entryGridOrEmpty(computeVaultList())}</div>`;
  }
  const groups = computeGroupedVault();
  if(groups.length === 0){
    return `<div class="entry-grid" id="entry-grid">${emptyStateHTML(state.search.trim().toLowerCase())}</div>`;
  }
  return groups.map(g => `
    <div class="category-section">
      <div class="category-section-header">
        <span class="category-section-dot" style="background:${g.color||'var(--text-faint)'};"></span>
        <div class="category-section-title">${esc(g.name)}</div>
        <div class="category-section-count">${g.items.length}</div>
      </div>
      <div class="entry-grid">${g.items.map(entryCardHTML).join('')}</div>
    </div>
  `).join('');
}

function breachReminderDue(){
  const weeks = state.prefs.breachReminderWeeks;
  if(!weeks) return false;
  if(state.breachBannerDismissed) return false;
  const last = state.prefs.lastBreachScanAt;
  if(!last) return true;
  return (Date.now() - last) > weeks*7*24*60*60*1000;
}

function expiryReminderCount(){
  if(state.expiryBannerDismissed) return 0;
  return state.entries.filter(e => {
    if((e.type||'login') !== 'login') return false;
    const s = expiryStatus(e);
    return s.state === 'expired' || s.state === 'soon';
  }).length;
}

}

function bindEntryCardEvents(){
  document.querySelectorAll('.entry-card').forEach(card => {
    const id = card.dataset.id;
    const entry = state.entries.find(e => e.id === id);
    if(!entry) return;

    const pwEl = card.querySelector('[data-pwtext]');
    if(pwEl){
      let revealed = false;
      const revealBtn = card.querySelector('[data-act=reveal]');
      // Plaintext is never kept in the DOM: always look the entry up from
      // state by id at the moment of reveal/copy.
      const currentEntry = () => state.entries.find(e => e.id === id);
      revealBtn.onclick = () => {
        if(!revealed){
          requireRevealPin(() => {
            const cur = currentEntry();
            if(!cur) return;
            revealed = true;
            pwEl.textContent = cur.password || '';
            revealBtn.innerHTML = svgEyeOff(15);
          });
        } else {
          revealed = false;
          pwEl.textContent = MASK_TEXT;
          revealBtn.innerHTML = svgEye(15);
        }
      };
      card.querySelector('[data-act=copy]').onclick = () => requireRevealPin(() => {
        const cur = currentEntry();
        if(cur) copyToClipboard(cur.password, 'Password');
      });
    }

    const copyBothBtn = card.querySelector('[data-act=copyboth]');
    if(copyBothBtn){
      copyBothBtn.onclick = () => requireRevealPin(() => {
        const cur = state.entries.find(e => e.id === id);
        if(cur) copyUsernameThenPassword(cur);
      });
    }

    const totpRow = card.querySelector('[data-totp-id]');
    if(totpRow){
      const revealTotpBtn = card.querySelector('[data-act=reveal-totp]');
      revealTotpBtn.onclick = () => {
        const isRevealed = totpRow.dataset.totpRevealed === '1';
        if(!isRevealed){
          requireRevealPin(() => {
            totpRow.dataset.totpRevealed = '1';
            revealTotpBtn.innerHTML = svgEyeOff(14);
          });
        } else {
          totpRow.dataset.totpRevealed = '0';
          revealTotpBtn.innerHTML = svgEye(14);
        }
      };
      card.querySelector('[data-act=copy-totp]').onclick = () => {
        requireRevealPin(() => {
          const cur = state.entries.find(e => e.id === id);
          if(!cur || !cur.totpSecret){ showToast('That TOTP secret looks invalid'); return; }
          totpCode(cur.totpSecret).then(code => copyToClipboard(code, '2FA code')).catch(()=> showToast('That TOTP secret looks invalid'));
        });
      };
      const qrBtn = card.querySelector('[data-act=qr-totp]');
      if(qrBtn) qrBtn.onclick = () => requireRevealPin(() => openTotpQrModal(entry));
    }

    card.querySelectorAll('[data-cf-reveal]').forEach(btn => {
      const idx = btn.dataset.cfReveal;
      const row = card.querySelector(`[data-cf-idx="${idx}"]`);
      const textEl = row.querySelector('[data-cf-text]');
      const cfValue = () => {
        const cur = state.entries.find(e => e.id === id);
        const f = cur && cur.customFields && cur.customFields[parseInt(idx,10)];
        return (f && f.value) || '';
      };
      let shown = false;
      btn.onclick = () => {
        if(!shown){
          requireRevealPin(() => {
            shown = true;
            textEl.textContent = cfValue() || '—';
            btn.innerHTML = svgEyeOff(13);
          });
        } else {
          shown = false;
          textEl.textContent = cfValue().length ? MASK_TEXT : '—';
          btn.innerHTML = svgEye(13);
        }
      };
    });
    card.querySelectorAll('[data-cf-copy]').forEach(btn => {
      const idx = btn.dataset.cfCopy;
      btn.onclick = () => requireRevealPin(() => {
        const cur = state.entries.find(e => e.id === id);
        const f = cur && cur.customFields && cur.customFields[parseInt(idx,10)];
        copyToClipboard((f && f.value) || '', 'Field value');
      });
    });

    const pinBtn = card.querySelector('[data-act=pin]');
    if(pinBtn){
      pinBtn.onclick = async () => {
        entry.pinned = !entry.pinned;
        await persistVault(state.username, state.key, syncActiveVaultAndGetAll());
        renderMain();
      };
    }
    card.querySelector('[data-act=edit]').onclick = () => requireRevealPin(() => openEntryModal('edit', entry));
    card.querySelector('[data-act=delete]').onclick = () => deleteEntry(entry.id);
  });
  const emptyAdd = document.getElementById('empty-add-btn');
  if(emptyAdd) emptyAdd.onclick = () => openEntryModal('add');
}

async function deleteEntry(id){
  const entry = state.entries.find(e=>e.id===id);
  if(!entry) return;
  if(!confirm(`Move “${entry.title || 'this entry'}” to trash? It stays recoverable there for ${TRASH_RETENTION_DAYS} days.`)) return;
  state.entries = state.entries.filter(e => e.id !== id);
  if(!Array.isArray(state.trash)) state.trash = [];
  state.trash = [{ ...entry, deletedAt: Date.now() }, ...state.trash];
  recordScoreHistoryPoint();
  await persistVault(state.username, state.key, syncActiveVaultAndGetAll());
  showToast('Moved to trash', svgTrash(14));
  renderApp();
}

        </div>

        <button class="btn btn-sm" data-trash-restore="${entry.id}" title="Restore">${svgClipboardCheck(13)} Restore</button>

    </div>
  </div>`;
}
function renderTrashView(el){
  const vaults = syncActiveVaultAndGetAll();
  const purged = purgeExpiredTrashFromVaults(vaults);
  state.trash = vaults[state.activeVaultIndex].trash;
  if(purged){
    persistVault(state.username, state.key, vaults); // fire-and-forget; nothing to wait on before rendering
  }
  const trash = state.trash || [];
  el.innerHTML = `
    <div class="topbar">
      <button class="hamburger btn btn-icon" id="hamburger-btn">${svgMenu(18)}</button>
      <div>
        <div class="view-title">Trash</div>
        <div class="view-sub">Deleted entries stay here for ${TRASH_RETENTION_DAYS} days before being permanently removed.</div>
      </div>
      ${trash.length > 0 ? `<button class="btn btn-sm btn-danger" id="empty-trash-btn">${svgTrash(13)} Empty trash</button>` : ''}
    </div>
    <div class="entry-grid" id="trash-grid">
      ${trash.length === 0
        ? `<div class="empty-state"><h3>Trash is empty</h3><p>Anything you delete from the vault shows up here first, recoverable for ${TRASH_RETENTION_DAYS} days.</p></div>`
        : trash.map(trashEntryHTML).join('')}
    </div>
  `;
  const ham = document.getElementById('hamburger-btn');
  if(ham) ham.onclick = () => document.getElementById('sidebar').classList.toggle('open');

  el.querySelectorAll('[data-trash-restore]').forEach(btn => {
    btn.onclick = () => restoreFromTrash(btn.dataset.trashRestore);
  });
  el.querySelectorAll('[data-trash-forever]').forEach(btn => {
    btn.onclick = () => deleteForever(btn.dataset.trashForever);
  });
  const emptyBtn = document.getElementById('empty-trash-btn');
  if(emptyBtn) emptyBtn.onclick = emptyTrash;
}
async function restoreFromTrash(id){
  const item = (state.trash||[]).find(e => e.id === id);
  if(!item) return;
  const { deletedAt, ...entry } = item;
  state.trash = state.trash.filter(e => e.id !== id);
  state.entries = [...state.entries, entry];
  recordScoreHistoryPoint();
  await persistVault(state.username, state.key, syncActiveVaultAndGetAll());
  showToast('Entry restored');
  renderApp();
}
async function deleteForever(id){
  const item = (state.trash||[]).find(e => e.id === id);
  if(!item) return;
  if(!confirm(`Permanently delete “${item.title || 'this entry'}”? This cannot be undone.`)) return;
  state.trash = state.trash.filter(e => e.id !== id);
  await persistVault(state.username, state.key, syncActiveVaultAndGetAll());
  showToast('Permanently deleted');
  renderApp();
}
async function emptyTrash(){
  const count = (state.trash||[]).length;
  if(count === 0) return;
  if(!confirm(`Permanently delete all ${count} item${count>1?'s':''} in trash? This cannot be undone.`)) return;
  state.trash = [];
  await persistVault(state.username, state.key, syncActiveVaultAndGetAll());
  showToast('Trash emptied');
  renderApp();
}

function openTotpScanModal(onResult){
  // Rendered into its own container appended to <body> (not #modal-root) so
  // the Add/Edit Entry form underneath survives the scan — same approach as
  // openServicePickerModal. Any previous scan container is torn down first.
  const prev = document.getElementById('scan-container');
  if(prev){ if(typeof prev._cleanup === 'function') prev._cleanup(); prev.remove(); }
  const root = document.createElement('div');
  root.id = 'scan-container';
  document.body.appendChild(root);
  root.innerHTML = `
    <div class="modal-overlay" id="scan-overlay" style="z-index:60;">
      <div class="modal" style="max-width:380px;">
        <div class="modal-head"><h3>Scan a 2FA QR code</h3><button class="icon-btn" id="scan-close">${svgX(16)}</button></div>
        <p style="font-size:12.5px;color:var(--text-faint);margin-bottom:14px;">Point a camera at the QR code an app shows you, or upload a screenshot of it. The image is processed only in this browser.</p>
        <div style="display:flex; gap:8px; margin-bottom:14px;">
          <button class="btn btn-sm" id="scan-camera-btn" style="flex:1;">Use camera</button>
          <label class="btn btn-sm" style="flex:1; text-align:center;">Upload image<input type="file" accept="image/*" id="scan-file-input" style="display:none;"></label>
        </div>
        <div id="scan-video-wrap" style="display:none; position:relative; border-radius:12px; overflow:hidden; background:#000;">
          <video id="scan-video" style="width:100%; display:block;" playsinline muted></video>
        </div>
        <div id="scan-status" style="font-size:12.5px; color:var(--text-faint); margin-top:10px;"></div>
      </div>
    </div>`;
  const statusEl = document.getElementById('scan-status');
  let stream = null;
  let rafId = null;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  let closed = false;
  const cleanup = () => {
    closed = true;
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  };
  root._cleanup = cleanup; // lets lockNow()/Escape stop the camera too
  const close = () => { cleanup(); root.remove(); };
  document.getElementById('scan-close').onclick = close;
  document.getElementById('scan-overlay').addEventListener('click',(e)=>{ if(e.target.id==='scan-overlay') close(); });

  function handleDecoded(text){
    const secret = parseOtpauthOrSecret(text);
    if(secret){
      close();
      onResult(secret);
      showToast('2FA secret imported from QR code');
    } else {
      statusEl.textContent = 'That QR code did not contain a recognizable 2FA secret.';
    }
  }

  document.getElementById('scan-camera-btn').onclick = async () => {
    try{ await ensureJsQrLib(); }catch(e){ statusEl.textContent = 'Could not load the QR scanner — check your connection.'; return; }
    if(!window.jsQR) return;
    if(closed) return;
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } // restarting the camera
    let newStream;
    try{
      newStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    }catch(e){
      statusEl.textContent = 'Camera access was denied or unavailable.';
      return;
    }
    if(closed){ newStream.getTracks().forEach(t => t.stop()); return; } // closed while the permission prompt was open
    stream = newStream;
    const video = document.getElementById('scan-video');
    document.getElementById('scan-video-wrap').style.display = 'block';
    video.srcObject = stream;
    try{ await video.play(); }catch(e){}
    if(closed) return;
    statusEl.textContent = 'Point the camera at the QR code…';
    const tick = () => {
      if(closed) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const result = window.jsQR(imageData.data, imageData.width, imageData.height);
        if(result && result.data){ handleDecoded(result.data); return; }
      }
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
  };

  document.getElementById('scan-file-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try{ await ensureJsQrLib(); }catch(err){ statusEl.textContent = 'Could not load the QR scanner — check your connection.'; return; }
    if(!window.jsQR) return;
    statusEl.textContent = 'Reading image…';
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(img.src);
      if(closed) return;
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      ctx.drawImage(img, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const result = window.jsQR(imageData.data, imageData.width, imageData.height);
      if(result && result.data){ handleDecoded(result.data); }
      else { statusEl.textContent = 'No QR code found in that image.'; }
    };
    img.onerror = () => { statusEl.textContent = 'Could not read that image file.'; };
    img.src = URL.createObjectURL(file);
  });
}

    const current = tagsInput.value.split(',').map(t=>t.trim().toLowerCase()).filter(Boolean);

  quickTagBtns.forEach(btn => {
    btn.onclick = () => {
      const tag = btn.dataset.quickTag;
      let current = tagsInput.value.split(',').map(t=>t.trim()).filter(Boolean);
      const idx = current.findIndex(t => t.toLowerCase() === tag.toLowerCase());
      if(idx >= 0) current.splice(idx,1); else current.push(tag);
      tagsInput.value = current.join(', ');
      refreshQuickTagChips();
    };
  });
  tagsInput.addEventListener('input', refreshQuickTagChips);
  refreshQuickTagChips();

  function refreshStrength(){
    const r = analyzePassword(pwInput.value, [titleInput.value, userInput.value]);

    resultEl.innerHTML = `<span style="color:var(--text-faint)">Checking…</span>`;

    }catch(e){

      <div class="form-row" data-cf-row="${i}" style="margin-bottom:8px;">

        <div style="display:flex; gap:6px;">

        </div>

    wrap.querySelectorAll('[data-cf-remove]').forEach(btn => {
      btn.onclick = () => {

        customFields.splice(parseInt(btn.dataset.cfRemove,10), 1);
        renderCustomFields();
      };
    });
  }
  function syncCustomFieldsFromDOM(){
    document.querySelectorAll('[data-cf-row]').forEach(row => {
      const i = parseInt(row.dataset.cfRow, 10);
      if(!customFields[i]) return;
      customFields[i].label = row.querySelector('[data-cf-label]').value;

    });
  }
  renderCustomFields();
  document.getElementById('add-custom-field-btn').onclick = () => {
    syncCustomFieldsFromDOM();
    customFields.push({id:'cf_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), label:'', value:''});
    renderCustomFields();
  };

  document.getElementById('entry-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    syncCustomFieldsFromDOM();
    const cleanedCustomFields = customFields
      .map(f => ({id:f.id, label:(f.label||'').trim(), value:f.value||''}))
      .filter(f => f.label || f.value);
    const rawTotp = document.getElementById('f-totp').value.trim().toUpperCase().replace(/\s+/g,'');
    const newEntry = {
      id: data.id || ('e_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
      type: currentType,
      pinned: !!data.pinned,
      title: document.getElementById('f-title').value.trim(),
      username: currentType === 'login' ? document.getElementById('f-username').value.trim() : '',
      password: currentType === 'login' ? document.getElementById('f-password').value : '',
      url: currentType === 'login' ? document.getElementById('f-url').value.trim() : '',

      expiryDays: currentType === 'login' ? (document.getElementById('f-expiry').value === '' ? null : parseInt(document.getElementById('f-expiry').value,10)) : null,

      notes: document.getElementById('f-notes').value.trim(),
      customFields: cleanedCustomFields,
      createdAt: data.createdAt || Date.now(),
      updatedAt: Date.now(),
    };
    // Password age only resets when the password actually changed (or on add);
    // otherwise keep the previous value, falling back for pre-existing entries.
    const passwordChanged = mode === 'add' || newEntry.password !== (data.password || '');
    newEntry.passwordUpdatedAt = passwordChanged ? Date.now() : passwordChangedAt(data);
    if(mode === 'add'){
      state.entries.push(newEntry);
    } else {
      state.entries = state.entries.map(en => en.id === newEntry.id ? newEntry : en);
    }
    recordScoreHistoryPoint();
    await persistVault(state.username, state.key, syncActiveVaultAndGetAll());
    close();
    showToast(mode==='add' ? 'Entry saved & encrypted' : 'Changes saved & encrypted', svgLock(14));
    renderMain();
  });
}

/* ---------------- Report view ---------------- */
function computeSecurityReport(){
  const loginEntries = state.entries.filter(e => (e.type||'login') === 'login');
  const weak = [];
  const expired = [];
  const expiringSoon = [];
  const reusedMap = {};
  loginEntries.forEach(e => {
    const r = analyzePassword(e.password, [e.title, e.username]);
    if(r.label === 'Very Weak' || r.label === 'Weak') weak.push({entry:e, result:r});
    const status = expiryStatus(e);
    if(status.state === 'expired') expired.push({entry:e, days: status.age, status});
    else if(status.state === 'soon') expiringSoon.push({entry:e, days: status.age, status});
    if(e.password){
      if(!reusedMap[e.password]) reusedMap[e.password] = [];
      reusedMap[e.password].push(e);
    }
  });
  const reused = Object.values(reusedMap).filter(group => group.length > 1);
  return {weak, expired, expiringSoon, reused, total: loginEntries.length};
}

  const input = document.getElementById('an-input');
  const toggle = document.getElementById('an-toggle');
  let masked = true;
  toggle.onclick = () => {
    masked = !masked;
    input.type = masked ? 'password' : 'text';
    toggle.innerHTML = masked ? svgEyeOff(18) : svgEye(18);
  };
  input.type = 'password';
  focusSoon('an-input');

  let leaked ={ status: 'idle', count: 0 }; // idle | checking | found | clean | error

  function leakedCardHTML(){
    if(!input.value) return { value:'—', sub:'Type a password to check', color:'var(--text-faint)' };
    if(leaked.status === 'checking') return { value:'Checking…', sub:'Hashing locally, only 5 hash chars sent', color:'var(--text-faint)' };
    if(leaked.status === 'found') return { value:`Found in ${fmtCount(leaked.count)} breaches`, sub:'Change this password everywhere it is used', color:'var(--red)' };

        <div class="metric-sub">${has ? scenarioList : 'Realistic offline-hash scenario'}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Dictionary Attack</div>
        <div class="metric-value" style="color:${has?r.dictionaryColor:'var(--text-faint)'}">${has ? esc(r.dictionaryRisk) : '—'}</div>
        <div class="metric-sub">${has ? esc(r.dictionaryTime) : 'Risk from wordlists & known leaks'}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Brute Force Time</div>
        <div class="metric-value">${has ? esc(r.bruteForceTime) : '—'}</div>
        <div class="metric-sub">At 10 billion guesses/sec (GPU farm)</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Character Variety</div>
        <div class="metric-value">${has ? r.varietyCount+' of 4 types' : '—'}</div>
        <div class="metric-sub">${has ? (r.varietyTypes.join(', ') || 'None detected') : 'Lower, upper, digits, symbols'}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Length</div>
        <div class="metric-value" style="color:${has && r.length<12 ? 'var(--amber)' : ''}">${has ? r.length+' characters' : '—'}</div>
        <div class="metric-sub">${has ? (r.length<12 ? 'Below the recommended 12' : 'Meets the recommended minimum') : 'Recommended: 12+'}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Repeated Characters</div>
        <div class="metric-value" style="color:${has && r.repeatedCount ? 'var(--amber)' : ''}">${has ? (r.repeatedCount ? r.repeatedCount+' run(s) found' : 'None found') : '—'}</div>

        <div class="metric-value" style="color:${leak.color}">${esc(leak.value)}</div>
        <div class="metric-sub">${esc(leak.sub)}</div>
        ${has ? `<button type="button" class="btn btn-sm" data-leak-check style="margin-top:8px;" ${leaked.status==='checking'?'disabled':''}>${leaked.status==='checking' ? 'Checking…' : (leaked.status==='idle' ? 'Check now' : 'Check again')}</button>` : ''}

    const fbEl = document.getElementById('an-feedback');

  document.getElementById('an-metrics').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-leak-check]');
    if(!btn || !input.value || leaked.status === 'checking') return;
    const pw = input.value;

      leaked = count > 0 ? { status:'found', count } : { status:'clean', count:0 };
    }catch(err){
      console.error('Breach check failed', err);
      leaked = { status:'error', count:0 };
    }
    update();
  });
  update();
}

  const ham = document.getElementById('hamburger-btn');
  if(ham) ham.onclick = () => document.getElementById('sidebar').classList.toggle('open');

  const lenInput = document.getElementById('opt-length');
  const lenVal = document.getElementById('len-val');
  lenInput.addEventListener('input', ()=> lenVal.textContent = lenInput.value);

  function currentOpts(){
    return {
      length: parseInt(lenInput.value,10),
      lower: document.getElementById('opt-lower').checked,
      upper: document.getElementById('opt-upper').checked,
      digits: document.getElementById('opt-digits').checked,
      symbols: document.getElementById('opt-symbols').checked,
      excludeAmbiguous: document.getElementById('opt-ambig').checked,
    };
  }
  let current = '';
  function regen(){
    const o = currentOpts();
    if(!o.lower && !o.upper && !o.digits && !o.symbols){
      showToast('Select at least one character type');
      return;
    }
    current = generatePassword(o);
    document.getElementById('gen-text').textContent = current;
    const r = analyzePassword(current);
    document.getElementById('gen-gauge').innerHTML = gaugeSVG(r.score, r.color, 96, 8);
    document.getElementById('gen-verdict').textContent = r.label;
    document.getElementById('gen-verdict').style.color = r.color;
    document.getElementById('gen-entropy').textContent = r.entropy + ' bits of entropy';
  }
  document.getElementById('gen-new').onclick = regen;
  document.getElementById('gen-refresh').onclick = regen;
  document.getElementById('gen-copy').onclick = () => current && copyToClipboard(current, 'Password');
  ['opt-lower','opt-upper','opt-digits','opt-symbols','opt-ambig'].forEach(id=>{
    document.getElementById(id).addEventListener('change', regen);
  });
  lenInput.addEventListener('change', regen);
  regen();
}

  };

  document.getElementById('gist-save-btn').onclick = async () => {
    state.prefs.githubGistToken = document.getElementById('gist-token-input').value.trim();
    await savePrefs(state.prefs);
    showToast('GitHub token saved');
  };
  document.getElementById('gist-autosync-toggle').onchange = async (e) => {
    state.prefs.githubGistAutoSync = e.target.checked;
    await savePrefs(state.prefs);
  };
  document.getElementById('gist-backup-btn').onclick = async (e) => {
    state.prefs.githubGistToken = document.getElementById('gist-token-input').value.trim();
    await savePrefs(state.prefs);
    if(!state.prefs.githubGistToken){ showToast('Enter a GitHub token first'); return; }
    e.target.disabled = true;
    const ok = await backupToGithubGist();
    e.target.disabled = false;
    showToast(ok ? 'Backup saved to GitHub Gist' : 'Gist backup failed — check the token and your connection');
    renderSettingsView(el);
  };

  const scanBtn = document.getElementById('scan-all-btn');
  if(scanBtn){
    scanBtn.onclick = async () => {
      const progressEl = document.getElementById('scan-progress');
      const resultsEl = document.getElementById('scan-results');
      // Don't re-render Settings here — that would wipe the scan results just shown.
      await runBreachScanAll(progressEl, resultsEl, scanBtn);
    };
  }

  document.getElementById('settings-lock-btn').onclick = lockNow;
  document.getElementById('wipe-btn').onclick = async () => {
    if(confirm('This permanently deletes your account and every vault and entry in it. This cannot be undone. Continue?')){
      await wipeVault(state.username);
      lockNow();
    }
  };
}

/* ---------------- Auto-lock on inactivity ---------------- */
let lastActivity = Date.now();
['mousemove','keydown','mousedown','scroll','touchstart'].forEach(evt=>{
  window.addEventListener(evt, ()=>{ lastActivity = Date.now(); }, {passive:true});
});
setInterval(()=>{
  if(!state.unlocked) return;
  const mins = state.prefs.autoLockMinutes;
  if(!mins) return;
  if(Date.now() - lastActivity >= mins*60000){
    lockNow();
    showToast('Locked due to inactivity', svgLock(14));
  }
}, 5000);

/* ---------------- Keyboard shortcuts ---------------- */
const KEYBOARD_SHORTCUTS = [
  { keys:'/', desc:'Focus search (switches to Vault view first)' },
  { keys:'N', desc:'Add a new entry (switches to Vault view first)' },
  { keys:'?', desc:'Show this keyboard shortcuts list' },
  { keys:'Esc', desc:'Close the topmost dialog or picker' },
];
function openShortcutsModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="shortcuts-overlay">
      <div class="modal" style="max-width:400px;">
        <div class="modal-head"><h3>Keyboard shortcuts</h3><button class="icon-btn" id="shortcuts-close">${svgX(16)}</button></div>
        ${KEYBOARD_SHORTCUTS.map(s => `
          <div class="settings-row">
            <div class="settings-row-sub" style="font-size:13px; color:var(--text-dim);">${esc(s.desc)}</div>
            <kbd style="font-family:var(--font-mono); font-size:12px; background:var(--bg-elev); border:1px solid var(--border); border-radius:6px; padding:3px 8px; flex-shrink:0;">${esc(s.keys)}</kbd>
          </div>
        `).join('')}
      </div>
    </div>`;
  const close = () => { root.innerHTML = ''; };
  document.getElementById('shortcuts-close').onclick = close;
  document.getElementById('shortcuts-overlay').addEventListener('click', (e)=>{ if(e.target.id==='shortcuts-overlay') close(); });
}
document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable);

  if(e.key === 'Escape'){
    const scanC = document.getElementById('scan-container');
    if(scanC){ if(typeof scanC._cleanup === 'function') scanC._cleanup(); scanC.remove(); return; }
    const svcPicker = document.getElementById('svcpicker-container');
    if(svcPicker){ svcPicker.remove(); return; }
    const root = document.getElementById('modal-root');
    if(root && root.querySelector('.modal-overlay')) root.innerHTML = '';
    return;
  }
  if(typing) return;
  if(!state.unlocked) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  // Don't open anything on top of a dialog that's already showing.
  const modalOpen = !!(document.getElementById('svcpicker-container') || document.getElementById('scan-container') ||
    (document.getElementById('modal-root') && document.getElementById('modal-root').querySelector('.modal-overlay')));
  if(modalOpen) return;

  if(e.key === '/'){
    e.preventDefault();
    if(state.view !== 'vault'){ state.view = 'vault'; renderApp(); }
    const s = document.getElementById('search-input');
    if(s) s.focus();
  } else if(e.key.toLowerCase() === 'n'){
    e.preventDefault();
    if(state.view !== 'vault'){ state.view = 'vault'; renderApp(); }
    openEntryModal('add');
  } else if(e.key === '?'){
    e.preventDefault();
    openShortcutsModal();
  }
});

/* ---------------- Mobile drawer backdrop ----------------
   Tap outside the slide-in sidebar (or press Escape) to close it. */
(function setupDrawerBackdrop(){
  const sb = document.getElementById('sidebar');
  if(!sb) return;
  const bd = document.createElement('div');
  bd.className = 'sidebar-backdrop';
  bd.addEventListener('click', () => sb.classList.remove('open'));
  (sb.parentNode || document.body).appendChild(bd); // same stacking context as the sidebar
  new MutationObserver(() => bd.classList.toggle('show', sb.classList.contains('open')))
    .observe(sb, {attributes:true, attributeFilter:['class']});
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') sb.classList.remove('open'); });
  window.addEventListener('resize', () => { if(window.innerWidth > 1024) sb.classList.remove('open'); });
})();

/* ---------------- Global safety net ----------------
   If anything throws outside a try/catch (e.g. a click handler
   crashes), surface it visibly instead of failing silently. */
window.addEventListener('error', (e) => {
  console.error('SecureSpace uncaught error:', e.error || e.message);
  showFatalBanner('Unexpected error: ' + (e.error && e.error.message ? e.error.message : e.message));
});
window.addEventListener('unhandledrejection', (e) => {
  console.error('SecureSpace unhandled rejection:', e.reason);
  showFatalBanner('Unexpected error: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
});
function showFatalBanner(msg){
  let el = document.getElementById('fatal-banner');
  if(!el){
    el = document.createElement('div');
    el.id = 'fatal-banner';
    el.style.cssText = 'position:fixed; top:0; left:0; right:0; z-index:200; background:#3a1418; color:#ffb4c0; font-family:sans-serif; font-size:13px; padding:12px 16px; text-align:center; border-bottom:1px solid rgba(251,113,133,0.4);';
    document.body.prepend(el);
  }
  el.textContent = msg;
}

/* ---------------- Boot ---------------- */
(async function init(){
  if(!window.isSecureContext || !window.crypto || !window.crypto.subtle){
    document.getElementById('lock-screen').innerHTML = `
      <div class="lock-card">
        <div class="lock-brand">
          <div class="brand-mark">${svgShield(21)}</div>
          <div><div class="brand-name">SecureSpace</div><div class="brand-sub">ENCRYPTED&nbsp;VAULT</div></div>
        </div>
        <div class="lock-error" style="margin-top:20px;">
          This browser is blocking the encryption features SecureSpace needs (Web Crypto API), which usually happens when a page is opened directly from a local file instead of a real web address.
        </div>
        <p class="lock-note" style="margin-top:16px;">Open this app from its deployed https:// link (e.g. your Netlify/Vercel/GitHub Pages URL) instead of double-clicking the downloaded file, and it will work normally.</p>
      </div>
    `;
    return;
  }
  state.prefs = await loadPrefs();
  applyTheme();
  startTotpTicker();
  try{ await restoreBackupFolderHandle(); }catch(e){ /* folder auto-backup just stays disconnected */ }
  renderLockScreen();
})();
</script>
