<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SecureSpace — Encrypted Password Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d13;
    --bg-elev: #0f131b;
    --bg-panel: #12161f;
    --card: rgba(255,255,255,0.035);
    --card-hover: rgba(255,255,255,0.055);
    --border: rgba(255,255,255,0.09);
    --border-soft: rgba(255,255,255,0.06);
    --text: #e7ecf3;
    --text-dim: #9aa4b8;
    --text-faint: #616c82;
    --cyan: #5eead4;
    --cyan-dim: #2dd4bf;
    --accent-rgb: 94,234,212;
    --accent-ink: #04211c;
    --glass-bg: rgba(18,22,31,0.62);
    --glass-blur: 18px;
    --violet: #9b8cff;
    --amber: #f5b94d;
    --red: #fb7185;
    --green: #4ade80;
    --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    --radius: 14px;
  }
  /* AMOLED — true-black background variant of the default dark theme */
  body.theme-amoled{
    --bg: #000000;
    --bg-elev: #000000;
    --bg-panel: #000000;
    --card: rgba(255,255,255,0.045);
    --card-hover: rgba(255,255,255,0.075);
    --border: rgba(255,255,255,0.11);
    --border-soft: rgba(255,255,255,0.08);
    --glass-bg: rgba(0,0,0,0.55);
  }

  /* Accent-color themes — same dark base, different brand accent */
  body.theme-blue{
    --cyan: #38bdf8;
    --cyan-dim: #0ea5e9;
    --accent-rgb: 56,189,248;
    --accent-ink: #04121c;
  }
  body.theme-purple{
    --cyan: #c084fc;
    --cyan-dim: #a855f7;
    --accent-rgb: 192,132,252;
    --accent-ink: #180b24;
  }
  body.theme-emerald{
    --cyan: #34d399;
    --cyan-dim: #10b981;
    --accent-rgb: 52,211,153;
    --accent-ink: #04211a;
  }
  body.theme-cybergreen{
    --bg: #050b06;
    --bg-elev: #060f07;
    --bg-panel: #08130a;
    --cyan: #39ff88;
    --cyan-dim: #00e676;
    --accent-rgb: 57,255,136;
    --accent-ink: #021208;
    --border: rgba(57,255,136,0.16);
    --border-soft: rgba(57,255,136,0.09);
    --glass-bg: rgba(5,15,7,0.6);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(91,234,212,0.07), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(155,140,255,0.08), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
    transition: background-color .2s ease, color .2s ease;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 42px 42px;
    pointer-events:none;
    mask-image: radial-gradient(ellipse at 30% 10%, black 0%, transparent 70%);
    z-index:0;
  }
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12); border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2);}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input, select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}

  h1,h2,h3,h4{font-family:var(--font-display); letter-spacing:-0.01em;}
  .mono{font-family:var(--font-mono);}
  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--text-faint);
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 18px; border-radius:10px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:14px; font-weight:500;
    transition: all .15s ease;
  }
  .btn:hover{background:var(--card-hover); border-color:rgba(255,255,255,0.16); transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-primary{
    background:linear-gradient(135deg, var(--cyan), var(--cyan-dim));
    color:var(--accent-ink); border:none; font-weight:600;
    box-shadow:0 0 0 1px rgba(var(--accent-rgb),0.25), 0 8px 24px -8px rgba(var(--accent-rgb),0.45);
  }
  .btn-primary:hover{filter:brightness(1.08); box-shadow:0 0 0 1px rgba(var(--accent-rgb),0.4), 0 10px 28px -6px rgba(var(--accent-rgb),0.55);}
  .btn-danger{border-color:rgba(251,113,133,0.35); color:var(--red);}
  .btn-danger:hover{background:rgba(251,113,133,0.1);}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 12px; font-size:12.5px; border-radius:8px;}
  .btn-icon{padding:9px; border-radius:8px;}

  /* ---------- Lock screen ---------- */
  #lock-screen{
    position:relative; z-index:1;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .lock-card{
    width:100%; max-width:420px;
    background:var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border:1px solid var(--border);
    border-radius:20px;
    padding:38px 34px 32px;
    position:relative;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.7);
    animation: viewFadeIn .35s cubic-bezier(.22,.68,.32,1);
  }
  @media (prefers-reduced-motion: reduce){
    .lock-card{ animation:none; }
  }
  .lock-brand{display:flex; align-items:center; gap:12px; margin-bottom:28px;}
  .brand-mark{
    width:40px; height:40px; border-radius:10px;
    background:linear-gradient(135deg, var(--cyan), var(--violet));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px -6px rgba(var(--accent-rgb),0.5);
    flex-shrink:0;
  }
  .brand-name{font-family:var(--font-display); font-size:19px; font-weight:700; letter-spacing:-0.01em;}
  .brand-sub{font-size:11px; color:var(--text-faint); font-family:var(--font-mono); letter-spacing:0.08em;}

  .scan-ring-wrap{
    position:relative; width:120px; height:120px; margin:6px auto 24px;
  }
  .scan-ring-wrap svg{transform:rotate(-90deg);}
  .scan-sweep{
    position:absolute; inset:-14px;
    border-radius:50%;
    background:conic-gradient(from 0deg, transparent 0deg, rgba(var(--accent-rgb),0.5) 40deg, transparent 90deg);
    animation: spin 3.2s linear infinite;
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
  }
  @keyframes spin{ to { transform:rotate(360deg); } }
  .spin-icon{ animation: spin .8s linear infinite; }

  .skeleton{
    border-radius:10px;
    background: linear-gradient(90deg, var(--card) 25%, var(--card-hover) 50%, var(--card) 75%);
    background-size: 200% 100%;
    animation: skeletonShimmer 1.3s ease-in-out infinite;
    border:1px solid var(--border-soft);
  }
  @keyframes skeletonShimmer{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
  @media (prefers-reduced-motion: reduce){
    .skeleton{ animation:none; }
    .spin-icon{ animation:none; }
  }
  .scan-icon{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  }

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:7px; font-weight:500;}
  .input-wrap{position:relative;}
  .field input[type=password], .field input[type=text]{
    width:100%; background:var(--bg-elev); border:1px solid var(--border);
    border-radius:10px; padding:12px 40px 12px 13px; color:var(--text); font-size:14.5px;
    font-family:var(--font-mono);
    transition:border-color .15s;
  }
  .field input:focus{border-color:var(--cyan);}
  .reveal-toggle{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--text-faint); padding:6px; border-radius:6px;
  }
  .reveal-toggle:hover{color:var(--text-dim); background:rgba(255,255,255,0.06);}

  .field-icon-left{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    color:var(--text-faint); pointer-events:none; display:flex; align-items:center;
  }
  .field input.has-icon{ padding-left:38px; }
  [data-remove-user]{ transition:color .15s ease, border-color .15s ease, background .15s ease; }
  [data-remove-user]:hover{ color:var(--red); border-color:rgba(251,113,133,0.4); background:rgba(251,113,133,0.1); }
  .lock-switch button.danger-muted{ color:var(--text-faint); transition:color .15s ease; }
  .lock-switch button.danger-muted:hover{ color:var(--red); }
  .picker-avatar{
    background:linear-gradient(135deg, rgba(94,234,212,0.35), rgba(155,140,255,0.35));
    color:var(--text); font-weight:700;
  }

  .lock-error{
    background:rgba(251,113,133,0.1); border:1px solid rgba(251,113,133,0.25); color:#ffb4c0;
    font-size:13px; padding:10px 12px; border-radius:9px; margin-bottom:16px;
  }
  .lock-note{font-size:12px; color:var(--text-faint); margin-top:18px; line-height:1.6; text-align:center;}
  .lock-switch{text-align:center; margin-top:16px; font-size:13px; color:var(--text-dim);}
  .lock-switch button{background:none; border:none; color:var(--cyan); font-weight:600; padding:0;}

  .mini-strength{margin-top:10px;}
  .strength-track{height:5px; border-radius:4px; background:rgba(255,255,255,0.08); overflow:hidden;}
  .strength-fill{height:100%; border-radius:4px; transition:width .25s ease, background-color .25s ease;}
  .strength-label-row{display:flex; justify-content:space-between; margin-top:6px; font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono);}

  /* ---------- Recovery key display ---------- */
  .recovery-key-box{
    font-family:var(--font-mono); font-size:20px; font-weight:600; letter-spacing:0.08em;
    text-align:center; color:var(--cyan); background:var(--bg-elev);
    border:1px dashed rgba(var(--accent-rgb),0.45); border-radius:12px;
    padding:18px 12px; margin-bottom:14px; word-break:break-all;
    user-select:all; -webkit-user-select:all; cursor:text;
  }
  .recovery-confirm{
    display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--text);
    margin-bottom:16px; cursor:pointer;
  }
  .recovery-confirm input{width:17px; height:17px; accent-color:var(--cyan); cursor:pointer; flex-shrink:0;}
  .btn:disabled{opacity:0.5; cursor:not-allowed; transform:none;}
  @media (max-width: 520px){
    .recovery-key-box{font-size:16px; letter-spacing:0.04em;}
  }

  /* ---------- App shell ---------- */
  #app-shell{position:relative; z-index:1; display:none; min-height:100vh;}
  #app-shell.active{display:flex;}
  .sidebar{
    width:236px; flex-shrink:0; background:var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border-right:1px solid var(--border-soft);
    padding:22px 16px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
    z-index:1;
  }
  .sidebar .lock-brand{margin-bottom:22px; padding-left:4px;}
  .nav-group{display:flex; flex-direction:column; gap:4px; flex:1;}
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px;
    color:var(--text-dim); font-size:13.5px; font-weight:500; background:none; border:none; text-align:left; width:100%;
    transition:all .12s;
  }
  .nav-item svg{flex-shrink:0; opacity:0.8;}
  .nav-item:hover{background:var(--card); color:var(--text);}
  .nav-item.active{background:rgba(var(--accent-rgb),0.1); color:var(--cyan);}
  .nav-item.active svg{opacity:1;}
  .sidebar-footer{border-top:1px solid var(--border-soft); padding-top:14px; margin-top:14px;}
  .session-pill{
    display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-faint); padding:0 12px 12px;
    font-family:var(--font-mono);
  }
  .pulse-dot{width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(74,222,128,0.18); animation:pulse 2s infinite;}
  @keyframes pulse{ 50%{opacity:0.4;} }
  .vault-switcher-label{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.07em; margin-bottom:6px; padding-left:2px;}

  .main{flex:1; min-width:0; padding:32px 40px 60px;}
  @keyframes viewFadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .view-transition{ animation: viewFadeIn .32s cubic-bezier(.22,.68,.32,1); }
  @media (prefers-reduced-motion: reduce){
    .view-transition{ animation:none; }
  }
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; gap:16px; flex-wrap:wrap;}
  .view-title{font-size:24px; font-weight:700;}
  .view-sub{color:var(--text-dim); font-size:13.5px; margin-top:4px;}

  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .search-input{
    background:var(--bg-elev); border:1px solid var(--border); border-radius:10px; padding:10px 14px 10px 38px;
    color:var(--text); font-size:13.5px; width:230px; position:relative;
  }
  select.search-input{padding-left:14px;}
  .search-wrap{position:relative;}
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-faint);}

  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px;}
  .stat-card{
    background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px 18px;
  }
  .stat-num{font-family:var(--font-display); font-size:26px; font-weight:700;}
  .stat-label{font-size:11.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.07em; margin-top:4px;}

  .entry-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:14px;}
  .category-section{margin-bottom:28px;}
  .category-section:last-child{margin-bottom:0;}
  .category-section-header{display:flex; align-items:center; gap:9px; margin-bottom:13px;}
  .category-section-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .category-section-title{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-dim);}
  .category-section-count{font-size:11px; color:var(--text-faint); font-family:var(--font-mono); background:rgba(255,255,255,0.06); padding:2px 8px; border-radius:20px;}
  .entry-card{
    background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:18px; transition:border-color .15s, background .15s; position:relative;
  }
  .entry-card:hover{border-color:rgba(255,255,255,0.16); background:var(--card-hover);}
  .entry-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px;}
  .entry-avatar{
    width:38px; height:38px; border-radius:9px; background:linear-gradient(135deg, rgba(var(--accent-rgb),0.22), rgba(155,140,255,0.22));
    display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--font-display); font-size:15px; color:var(--cyan);
    flex-shrink:0; overflow:hidden;
  }
  .entry-title{font-weight:600; font-size:14.5px;}
  .entry-user{color:var(--text-faint); font-size:12px; font-family:var(--font-mono); margin-top:2px;}
  .entry-actions{display:flex; gap:4px;}
  .icon-btn{
    background:none; border:none; color:var(--text-faint); padding:6px; border-radius:7px; display:flex;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.08); color:var(--text);}
  .entry-pw-row{
    display:flex; align-items:center; gap:8px; background:var(--bg-elev); border:1px solid var(--border-soft);
    border-radius:9px; padding:9px 10px; margin-bottom:12px;
  }
  .entry-pw-text{font-family:var(--font-mono); font-size:13px; flex:1; letter-spacing:0.03em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .badge{
    font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:20px; font-family:var(--font-mono);
    text-transform:uppercase; letter-spacing:0.05em;
  }
  .entry-bottom{display:flex; align-items:center; justify-content:space-between;}
  .entry-tags{display:flex; gap:5px; flex-wrap:wrap;}
  .tag{font-size:10.5px; color:var(--text-dim); background:rgba(255,255,255,0.05); padding:3px 8px; border-radius:6px;}

  .empty-state{
    text-align:center; padding:70px 20px; color:var(--text-faint); grid-column:1/-1;
    border:1px dashed var(--border); border-radius:var(--radius);
  }
  .empty-state h3{color:var(--text-dim); margin-bottom:6px; font-size:16px;}
  .empty-state p{font-size:13px; max-width:340px; margin:0 auto 18px;}

  /* ---------- Panels / cards general ---------- */
  .panel{background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius); padding:26px;}
  .panel + .panel{margin-top:18px;}
  .panel, .stat-card, .entry-card, .metric-card, .theme-swatch-btn{
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .two-col{display:grid; grid-template-columns:1.15fr 0.85fr; gap:20px; align-items:start;}

  /* ---------- Analyzer / Generator ---------- */
  .big-input{
    width:100%; background:var(--bg-elev); border:1px solid var(--border); border-radius:12px;
    padding:16px 46px 16px 16px; color:var(--text); font-family:var(--font-mono); font-size:17px;
    letter-spacing:0.02em;
  }
  .big-input:focus{border-color:var(--cyan);}
  .gauge-wrap{display:flex; align-items:center; gap:22px; margin-top:22px;}
  .gauge{position:relative; width:132px; height:132px; flex-shrink:0;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .gauge-score{font-family:var(--font-display); font-size:26px; font-weight:700;}
  .gauge-score-label{font-size:10px; color:var(--text-faint); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.08em;}
  .gauge-verdict{font-family:var(--font-display); font-size:20px; font-weight:700; margin-bottom:4px;}
  .gauge-entropy{font-size:12.5px; color:var(--text-dim); font-family:var(--font-mono);}

  .gauge-arc{ animation: gaugeDraw .6s cubic-bezier(.22,.68,.32,1) forwards; }
  @keyframes gaugeDraw{ to{ stroke-dashoffset: var(--gauge-target); } }
  .chart-line{
    stroke-dasharray: var(--path-len);
    stroke-dashoffset: var(--path-len);
    animation: chartDraw 1s cubic-bezier(.22,.68,.32,1) forwards;
  }
  @keyframes chartDraw{ to{ stroke-dashoffset:0; } }
  .chart-dot{ opacity:0; animation: chartDotFade .3s ease forwards; }
  @keyframes chartDotFade{ to{ opacity:1; } }
  @media (prefers-reduced-motion: reduce){
    .gauge-arc{ animation:none; stroke-dashoffset: var(--gauge-target); }
    .chart-line{ animation:none; stroke-dashoffset:0; }
    .chart-dot{ animation:none; opacity:1; }
  }

  .crack-table{margin-top:20px; border-top:1px solid var(--border-soft); padding-top:16px;}
  .crack-row{display:flex; justify-content:space-between; padding:8px 0; font-size:13px; border-bottom:1px solid var(--border-soft);}
  .crack-row:last-child{border-bottom:none;}
  .crack-scenario{color:var(--text-dim);}
  .crack-time{font-family:var(--font-mono); font-weight:600;}

  .feedback-list{list-style:none; margin-top:16px; display:flex; flex-direction:column; gap:8px;}
  .feedback-item{display:flex; align-items:flex-start; gap:9px; font-size:13px; color:var(--text-dim); line-height:1.5;}
  .feedback-item svg{margin-top:2px; flex-shrink:0;}
  .feedback-item.good{color:var(--text-dim);}

  .theme-swatch-grid{display:flex; flex-wrap:wrap; gap:10px;}
  .theme-swatch-btn{
    display:flex; flex-direction:column; align-items:center; gap:7px; width:80px;
    padding:12px 8px 10px; border-radius:12px; border:1.5px solid var(--border-soft);
    background:var(--card); transition:all .15s ease;
  }
  .theme-swatch-btn:hover{background:var(--card-hover); border-color:var(--border);}
  .theme-swatch-btn.active{border-color:var(--cyan);}

<body>

<div id="lock-screen"></div>

<div id="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   SecureSpace — client-side encrypted password vault
   All encryption happens locally with the Web Crypto API.
   The master password is never stored — only a salt and a
   verifier ciphertext are kept, and every write to storage
   is AES-256-GCM ciphertext.
   ========================================================= */

/* =========================================================
   MULTI-USER ACCOUNTS
   Each account gets its own salt, its own PBKDF2-derived AES key,
   and its own encrypted vault blob, namespaced by username. There
   is no master key, no admin account, and no backend — this file
   never holds anything capable of decrypting a user's data except
   that user's own password, entered at that moment, in that
   browser. The users index below stores usernames only (never
   passwords, salts are per-account and live with each account's
   own record) purely so the account picker can list who has an
   account on this device.
   ========================================================= */
const USERS_INDEX_KEY = 'securespace:users';
function metaKeyFor(username){ return `securespace:${username}:meta`; }
function vaultKeyFor(username){ return `securespace:${username}:vault`; }
function normalizeUsername(u){ return (u||'').trim().toLowerCase().replace(/[^a-z0-9_.-]/g,''); }

/* ---------------- Crypto helpers ---------------- */
function randomBytes(n){ return crypto.getRandomValues(new Uint8Array(n)); }
function bufToB64(buf){
  const bytes = new Uint8Array(buf);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToBuf(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr.buffer;
}
async function deriveKey(password, saltBuf, iterations){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: saltBuf, iterations, hash:'SHA-256'},
    baseKey,
    {name:'AES-GCM', length:256},
    false,
    ['encrypt','decrypt']
  );
}
async function encryptStr(key, plaintext){
  const iv = randomBytes(12);
  const enc = new TextEncoder();
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(plaintext));
  return {iv: bufToB64(iv), ct: bufToB64(ct)};
}
async function decryptStr(key, ivB64, ctB64){
  const iv = new Uint8Array(b64ToBuf(ivB64));
  const ptBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, b64ToBuf(ctB64));
  return new TextDecoder().decode(ptBuf);
}
const ITERATIONS = 250000;
const VERIFIER_TEXT = 'SECURESPACE-VERIFIED-OK';

/* ---------------- Recovery key ----------------
   A master password can't be recovered from the app — the vault key is
   PBKDF2(password). To still allow a reset, each account can hold a
   recovery key: a random 20-character code (100 bits) shown to the user
   once. The master password is encrypted under a key derived from that
   recovery key and stored in meta.recovery. Whoever has the recovery key
   (plus this browser's stored data) can reset the password, so it must be
   kept offline. 32-character alphabet (no 0/O/1/I) so 256 % 32 === 0 and
   every character is uniformly distributed. */
const RECOVERY_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function generateRecoveryKey(){
  const bytes = randomBytes(20);
  let out = '';
  for(let i=0;i<20;i++) out += RECOVERY_ALPHABET[bytes[i] % RECOVERY_ALPHABET.length];
  return out.match(/.{5}/g).join('-');
}
function normalizeRecoveryKey(k){ return String(k||'').replace(/[\s-]+/g,'').toUpperCase(); }
async function makeRecoveryBlob(recoveryKey, masterPassword){
  const salt = randomBytes(16);
  const key = await deriveKey(normalizeRecoveryKey(recoveryKey), salt, ITERATIONS);
  const enc = await encryptStr(key, masterPassword);
  return {salt: bufToB64(salt), iterations: ITERATIONS, iv: enc.iv, ct: enc.ct};
}
async function openRecoveryBlob(recoveryKey, blob){
  const salt = new Uint8Array(b64ToBuf(blob.salt));
  const key = await deriveKey(normalizeRecoveryKey(recoveryKey), salt, blob.iterations || ITERATIONS);
  return decryptStr(key, blob.iv, blob.ct); // throws on a wrong recovery key
}

/* Storage layer: plain browser localStorage. This makes the vault fully
   self-contained so it works the same whether it's opened as a file,
   previewed in Claude, or deployed to a real domain. Data lives only in
   this browser on this device — that's expected for a static, no-backend
   password vault. */
function makeLocalStorageShim(){
  const prefix = 'securespace__';
  return {
    async get(key){
      const raw = localStorage.getItem(prefix+key);
      if(raw === null) throw new Error('NOT_FOUND');
      return {key, value: raw};
    },
    async set(key, value){
      localStorage.setItem(prefix+key, value);
      return {key, value};
    },
    async delete(key){
      localStorage.removeItem(prefix+key);
      return {key, deleted:true};
    },
    async list(prefixArg){
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(prefix)){
          const stripped = k.slice(prefix.length);
          if(!prefixArg || stripped.startsWith(prefixArg)) keys.push(stripped);
        }
      }
      return {keys};
    }
  };
}
const usingFallbackStorage = true;
const storageAPI = makeLocalStorageShim();

/* ---------------- User directory (identifiers only) ---------------- */
async function listUsers(){
  try{
    const r = await storageAPI.get(USERS_INDEX_KEY);
    return JSON.parse(r.value);
  }catch(e){ return []; }
}
async function saveUsers(users){
  await storageAPI.set(USERS_INDEX_KEY, JSON.stringify(users));
}
async function usernameTaken(username){
  const users = await listUsers();
  return users.some(u => u.username === username);
}

/* ---------------- Per-account vault operations ----------------
   Each account's plaintext vault payload is shaped as:
     { vaults: [ { name, entries, scoreHistory }, ... ] }
   "vaults" lets one account hold multiple named sub-vaults (e.g.
   Personal / Work) switchable without re-entering the master
   password, since they all decrypt under the same account key.
   Older payloads shaped as { entries, scoreHistory } are migrated
   into a single "Personal" vault automatically on unlock. */
async function accountExists(username){
  try{
    const r = await storageAPI.get(metaKeyFor(username));
    return !!r;
  }catch(e){ return false; }
}
async function createVault(username, displayName, password){
  const salt = randomBytes(16);
  const key = await deriveKey(password, salt, ITERATIONS);
  const verifier = await encryptStr(key, VERIFIER_TEXT);
  const recoveryKey = generateRecoveryKey();
  const recovery = await makeRecoveryBlob(recoveryKey, password);
  const meta = {salt: bufToB64(salt), iterations: ITERATIONS, verifierIv: verifier.iv, verifierCt: verifier.ct, createdAt: Date.now(), recovery};
  await storageAPI.set(metaKeyFor(username), JSON.stringify(meta));
  const initialVaults = [{ name: 'Personal', entries: [], scoreHistory: [], trash: [] }];
  const vaultEnc = await encryptStr(key, JSON.stringify({vaults: initialVaults}));
  await storageAPI.set(vaultKeyFor(username), JSON.stringify({iv: vaultEnc.iv, ct: vaultEnc.ct, updatedAt: Date.now()}));
  const users = (await listUsers()).filter(u => u.username !== username);
  users.push({username, displayName, createdAt: Date.now()});
  await saveUsers(users);
  return {key, recoveryKey};
}
async function unlockVault(username, password){
  const metaRes = await storageAPI.get(metaKeyFor(username));
  const meta = JSON.parse(metaRes.value);
  const salt = new Uint8Array(b64ToBuf(meta.salt));
  const key = await deriveKey(password, salt, meta.iterations);
  let verified;
  try{
    verified = await decryptStr(key, meta.verifierIv, meta.verifierCt);
  }catch(e){ throw new Error('WRONG_PASSWORD'); }
  if(verified !== VERIFIER_TEXT) throw new Error('WRONG_PASSWORD');
  const vaultRes = await storageAPI.get(vaultKeyFor(username));
  const vaultMeta = JSON.parse(vaultRes.value);
  const plain = await decryptStr(key, vaultMeta.iv, vaultMeta.ct);
  const data = JSON.parse(plain);
  let vaults = data.vaults;
  if(!vaults || !Array.isArray(vaults) || vaults.length === 0){
    vaults = [{ name: 'Personal', entries: data.entries || [], scoreHistory: data.scoreHistory || [], trash: data.trash || [] }];
  }
  // Normalize older vaults that predate the trash array so every vault
  // object has one, then drop anything past its 30-day retention window.
  vaults.forEach(v => { if(!Array.isArray(v.trash)) v.trash = []; });
  purgeExpiredTrashFromVaults(vaults);
  return {key, vaults};
}
async function persistVault(username, key, vaults){
  const enc = await encryptStr(key, JSON.stringify({vaults}));
  await storageAPI.set(vaultKeyFor(username), JSON.stringify({iv: enc.iv, ct: enc.ct, updatedAt: Date.now()}));
  await recordAutoSnapshot(username, enc.iv, enc.ct);
  scheduleAutoBackups();
}
async function changeMasterPassword(username, oldVaults, newPassword){
  const salt = randomBytes(16);
  const key = await deriveKey(newPassword, salt, ITERATIONS);
  const verifier = await encryptStr(key, VERIFIER_TEXT);
  // A new password invalidates the old recovery blob (it encrypts the old
  // password), so issue a fresh recovery key alongside the new meta.
  const recoveryKey = generateRecoveryKey();
  const recovery = await makeRecoveryBlob(recoveryKey, newPassword);
  const meta = {salt: bufToB64(salt), iterations: ITERATIONS, verifierIv: verifier.iv, verifierCt: verifier.ct, createdAt: Date.now(), recovery};
  // Encrypt first so a failure can't leave new meta paired with an old-key vault.
  const enc = await encryptStr(key, JSON.stringify({vaults: oldVaults}));
  await storageAPI.set(metaKeyFor(username), JSON.stringify(meta));
  await storageAPI.set(vaultKeyFor(username), JSON.stringify({iv: enc.iv, ct: enc.ct, updatedAt: Date.now()}));
  // Old snapshots are encrypted under the old key and could no longer be
  // restored — drop them and start a fresh history under the new key.
  try{ await storageAPI.delete(snapshotsKeyFor(username)); }catch(e){}
  await recordAutoSnapshot(username, enc.iv, enc.ct);
  scheduleAutoBackups();
  return {key, recoveryKey};
}
/* Whether this account's meta carries a recovery blob (accounts created
   before the recovery-key feature don't). */
async function accountHasRecovery(username){
  try{
    const r = await storageAPI.get(metaKeyFor(username));
    return !!JSON.parse(r.value).recovery;
  }catch(e){ return false; }
}
/* Issues a new recovery key for an existing account (replacing any old one).
   The caller must already have verified masterPassword. Only meta.recovery
   changes — salt, verifier and the vault blob are left untouched. */
async function regenerateRecoveryKey(username, masterPassword){
  const metaRes = await storageAPI.get(metaKeyFor(username));
  const meta = JSON.parse(metaRes.value);
  const recoveryKey = generateRecoveryKey();
  meta.recovery = await makeRecoveryBlob(recoveryKey, masterPassword);
  await storageAPI.set(metaKeyFor(username), JSON.stringify(meta));
  return recoveryKey;
}
async function wipeVault(username){
  try{ await storageAPI.delete(metaKeyFor(username)); }catch(e){}
  try{ await storageAPI.delete(vaultKeyFor(username)); }catch(e){}
  try{ await storageAPI.delete(snapshotsKeyFor(username)); }catch(e){}
  const users = await listUsers();
  await saveUsers(users.filter(u => u.username !== username));
}
/* Keeps state.vaults[state.activeVaultIndex] in sync with the working
   state.entries/state.scoreHistory, then returns the full vaults array
   ready to hand to persistVault. Every save/delete goes through this so
   switching vaults never silently drops unsaved edits. */
function syncActiveVaultAndGetAll(){
  const active = state.vaults[state.activeVaultIndex];
  if(active){
    active.entries = state.entries;
    active.scoreHistory = state.scoreHistory;
    active.trash = state.trash;
  }
  return state.vaults;
}

/* ---------------- Trash (soft delete) ----------------
   Deleting an entry doesn't erase it immediately — it moves into this
   vault's trash with a timestamp, and stays recoverable for 30 days
   before being purged for good. Purging happens automatically whenever
   a vault is unlocked or switched to, never silently in the background. */
const TRASH_RETENTION_DAYS = 30;
function purgeExpiredTrashFromVaults(vaults){
  const cutoff = Date.now() - TRASH_RETENTION_DAYS*24*60*60*1000;
  let purgedAny = false;
  (vaults||[]).forEach(v => {
    if(!Array.isArray(v.trash)) { v.trash = []; return; }
    const before = v.trash.length;
    v.trash = v.trash.filter(item => (item.deletedAt||0) > cutoff);
    if(v.trash.length !== before) purgedAny = true;
  });
  return purgedAny;
}

/* ---------------- Backup payload + local recovery snapshots ----------------
   Every save keeps a rolling history of the last few encrypted vault
   states (still full AES-256-GCM ciphertext, exactly like the live
   vault) so an accidental delete or edit can be undone even without an
   external backup file. This lives in the same browser storage as
   everything else — it's a safety net, not an off-device backup. */
function snapshotsKeyFor(username){ return `securespace:${username}:snapshots`; }
const MAX_SNAPSHOTS = 5;
async function recordAutoSnapshot(username, iv, ct){
  let snapshots = [];
  try{
    const r = await storageAPI.get(snapshotsKeyFor(username));
    snapshots = JSON.parse(r.value);
  }catch(e){ snapshots = []; }
  snapshots.push({t: Date.now(), iv, ct});
  if(snapshots.length > MAX_SNAPSHOTS) snapshots = snapshots.slice(snapshots.length - MAX_SNAPSHOTS);
  await storageAPI.set(snapshotsKeyFor(username), JSON.stringify(snapshots));
}
async function listSnapshots(username){
  try{
    const r = await storageAPI.get(snapshotsKeyFor(username));
    return JSON.parse(r.value).slice().reverse(); // newest first
  }catch(e){ return []; }
}
async function restoreSnapshot(snapshot){
  const plain = await decryptStr(state.key, snapshot.iv, snapshot.ct);
  const data = JSON.parse(plain);
  let vaults = data.vaults;
  if(!vaults || !Array.isArray(vaults) || vaults.length === 0){
    vaults = [{ name: 'Personal', entries: data.entries || [], scoreHistory: data.scoreHistory || [], trash: data.trash || [] }];
  }
  vaults.forEach(v => { if(!Array.isArray(v.trash)) v.trash = []; });
  // Take a snapshot of the current state first so this restore can itself be undone.
  await persistVault(state.username, state.key, syncActiveVaultAndGetAll());
  state.vaults = vaults;
  state.activeVaultIndex = 0;
  state.entries = state.vaults[0].entries;
  state.scoreHistory = state.vaults[0].scoreHistory || [];
  state.trash = state.vaults[0].trash || [];
  await persistVault(state.username, state.key, state.vaults);
}

/* ---------------- Shared backup payload builder ---------------- */
async function buildBackupPayload(username){
  const meta = await storageAPI.get(metaKeyFor(username));
  const vault = await storageAPI.get(vaultKeyFor(username));
  return { app:'SecureSpace', version:3, username, exportedAt: new Date().toISOString(), meta: JSON.parse(meta.value), vault: JSON.parse(vault.value) };
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

/* ---------------- Restore an account from a backup file ----------------
   localStorage never crosses browsers, devices, or even origins (file://
   vs a local dev server count as different origins) — so this is the only
   way an account moves between them. It only ever writes back the same
   already-encrypted meta/vault blobs a backup already contains; nothing
   here sees or needs the master password until the restored account is
   unlocked normally afterward. */
async function parseBackupFile(file){
  const name = (file.name||'').toLowerCase();
  let text;
  if(name.endsWith('.zip')){
    await ensureJsZipLib();
    const zip = await JSZip.loadAsync(file);
    const jsonEntry = zip.file(/\.json$/i)[0];
    if(!jsonEntry) throw new Error("No .json backup file found inside that zip.");
    text = await jsonEntry.async('string');
  } else {
    text = await file.text();
  }
  let backup;
  try{ backup = JSON.parse(text); }
  catch(e){ throw new Error("That file isn't valid JSON."); }
  if(backup.app !== 'SecureSpace' || !backup.username || !backup.meta || !backup.vault){
    throw new Error("This file doesn't look like a SecureSpace backup.");
  }
  return backup;
}
async function restoreAccountFromBackup(backup, usernameOverride){
  const username = normalizeUsername(usernameOverride || backup.username);
  if(!username) throw new Error('Invalid username.');
  await storageAPI.set(metaKeyFor(username), JSON.stringify(backup.meta));
  await storageAPI.set(vaultKeyFor(username), JSON.stringify(backup.vault));
  const users = await listUsers();
  if(!users.some(u => u.username === username)){
    users.push({username, displayName: backup.username, createdAt: Date.now()});
    await saveUsers(users);
  }
  return username;
}

/* ---------------- IndexedDB ----------------
   Used only to persist the optional local backup-folder handle across
   reloads (a FileSystemDirectoryHandle can't be stored in localStorage,
   which only holds strings). Everything else in the app stays in
   localStorage as before. */
function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('securespace-fs', 1);
    req.onupgradeneeded = () => { if(!req.result.objectStoreNames.contains('handles')) req.result.createObjectStore('handles'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function idbDelete(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ---------------- Auto-backup to a local folder (File System Access API)
   Chrome/Edge only — Firefox and Safari don't implement this API, so the
   feature quietly disables itself there. The browser (not SecureSpace)
   decides how long write permission is remembered; if it lapses,
   reconnecting just needs one more folder pick. */
function supportsFSAccess(){ return typeof window.showDirectoryPicker === 'function'; }
let backupDirHandle = null;
async function restoreBackupFolderHandle(){
  if(!supportsFSAccess()) return;
  try{
    const handle = await idbGet('backupDirHandle');
    if(!handle) return;
    const perm = await handle.queryPermission({mode:'readwrite'});
    backupDirHandle = (perm === 'granted') ? handle : null;
  }catch(e){ backupDirHandle = null; }
}
async function chooseBackupFolder(){
  if(!supportsFSAccess()){ showToast("This browser doesn't support folder auto-backup — try Chrome or Edge"); return false; }
  try{
    const handle = await window.showDirectoryPicker({mode:'readwrite'});
    await idbSet('backupDirHandle', handle);
    backupDirHandle = handle;
    state.prefs.autoBackupFolderEnabled = true;
    await savePrefs(state.prefs);
    await writeAutoBackupToFolder();
    return true;
  }catch(e){ return false; } // user cancelled the picker
}
async function disconnectBackupFolder(){
  backupDirHandle = null;
  try{ await idbDelete('backupDirHandle'); }catch(e){}
  state.prefs.autoBackupFolderEnabled = false;
  await savePrefs(state.prefs);
}
async function writeAutoBackupToFolder(){
  if(!backupDirHandle || !state.username) return false;
  try{
    const backup = await buildBackupPayload(state.username);
    const fileHandle = await backupDirHandle.getFileHandle(`securespace-${state.username}-autobackup.json`, {create:true});
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(backup, null, 2));
    await writable.close();
    state.prefs.lastBackupAt = Date.now();
    await savePrefs(state.prefs);
    return true;
  }catch(e){ console.error('Folder auto-backup failed', e); return false; }
}

/* ---------------- Cloud backup: generic webhook ----------------
   Sends the same already-encrypted backup payload to a URL the user
   supplies — their own server, a self-hosted endpoint, or a webhook
   relay into Dropbox/Drive/etc. SecureSpace never sees or stores this
   destination beyond the user's own browser, and never adds its own
   credentials to the request. */
async function backupToWebhook(){
  const url = (state.prefs.cloudWebhookUrl||'').trim();
  if(!url) return false;
  try{
    const backup = await buildBackupPayload(state.username);
    const headers = {'Content-Type':'application/json'};
    if(state.prefs.cloudWebhookToken) headers['Authorization'] = `Bearer ${state.prefs.cloudWebhookToken}`;
    const res = await fetch(url, {method:'POST', headers, body: JSON.stringify(backup)});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    state.prefs.lastBackupAt = Date.now();
    await savePrefs(state.prefs);
    return true;
  }catch(e){ console.error('Webhook backup failed', e); return false; }
}

/* ---------------- Cloud backup: GitHub Gist ----------------
   Uses a personal access token (scope: gist) the user creates themselves
   on github.com and pastes in below. The token is stored only in this
   browser's local preferences, exactly like the webhook token — it is
   never sent anywhere except directly to api.github.com. The gist is
   created "secret" (unlisted, not truly private), but its contents are
   the same AES-256-GCM ciphertext as every other backup format, so
   nothing readable leaves this device even if the gist link leaked. */
async function backupToGithubGist(){
  const token = (state.prefs.githubGistToken||'').trim();
  if(!token) return false;
  try{
    const backup = await buildBackupPayload(state.username);
    const filename = `securespace-${state.username}-backup.json`;
    const body = { description: 'SecureSpace encrypted vault backup (auto-managed, do not edit)', public: false, files: { [filename]: { content: JSON.stringify(backup, null, 2) } } };
    const headers = { 'Authorization': `Bearer ${token}`, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' };
    let res;
    if(state.prefs.githubGistId){
      res = await fetch(`https://api.github.com/gists/${state.prefs.githubGistId}`, {method:'PATCH', headers, body: JSON.stringify(body)});
      if(res.status === 404){
        res = await fetch('https://api.github.com/gists', {method:'POST', headers, body: JSON.stringify(body)});
      }
    } else {
      res = await fetch('https://api.github.com/gists', {method:'POST', headers, body: JSON.stringify(body)});
    }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if(json.id) state.prefs.githubGistId = json.id;
    state.prefs.lastBackupAt = Date.now();
    await savePrefs(state.prefs);
    return true;
  }catch(e){ console.error('GitHub Gist backup failed', e); return false; }
}

/* ---------------- Debounced auto-backup dispatcher ----------------
   Called after every vault save. Waits a few seconds so a burst of
   edits triggers one round of backups instead of one per keystroke-
   level save, then fires whichever destinations are turned on. */
let autoBackupTimer = null;
function scheduleAutoBackups(){
  if(!state.username) return;
  if(!state.prefs.autoBackupFolderEnabled && !state.prefs.cloudWebhookAutoSync && !state.prefs.githubGistAutoSync) return;
  clearTimeout(autoBackupTimer);
  autoBackupTimer = setTimeout(async () => {
    if(state.prefs.autoBackupFolderEnabled) await writeAutoBackupToFolder();
    if(state.prefs.cloudWebhookAutoSync) await backupToWebhook();
    if(state.prefs.githubGistAutoSync) await backupToGithubGist();
  }, 3000);
}
function backupReminderDue(){
  const weeks = state.prefs.backupReminderWeeks;
  if(!weeks) return false;
  if(state.backupBannerDismissed) return false;
  const last = state.prefs.lastBackupAt;
  if(!last) return true;
  return (Date.now() - last) > weeks*7*24*60*60*1000;
}

/* ---------------- Device / activity detection ----------------
   SecureSpace has no server, so it has no way to see other browsers or
   devices — there's no account in the cloud to report back to. What it
   can do honestly is read this browser's own user-agent to label itself,
   and keep a small local log of when this browser has unlocked the
   vault. That log never leaves this browser and never merges with any
   other device's log. */
function detectDeviceInfoSync(){
  const ua = navigator.userAgent || '';
  let os = 'Unknown OS';
  let guessedType = 'Laptop';
  if(/Windows/i.test(ua)){ os = 'Windows'; }
  else if(/Mac OS X/i.test(ua)){ os = 'macOS'; }
  else if(/Android/i.test(ua)){ os = 'Android'; guessedType = 'Phone'; }
  else if(/iPad/i.test(ua)){ os = 'iOS'; guessedType = 'Tablet'; }
  else if(/iPhone|iPod/i.test(ua)){ os = 'iOS'; guessedType = 'Phone'; }
  else if(/CrOS/i.test(ua)){ os = 'ChromeOS'; }
  else if(/Linux/i.test(ua)){ os = 'Linux'; }
  // Browsers don't expose laptop-vs-desktop, so "Laptop" is just the most
  // common default for a non-mobile device — rename it in Settings if
  // this is actually a desktop.
  let browser = 'Browser';
  if(/Edg\//.test(ua)) browser = 'Edge';
  else if(/OPR\//.test(ua)) browser = 'Opera';
  else if(/Firefox\//.test(ua)) browser = 'Firefox';
  else if(/Chrome\//.test(ua)) browser = 'Chrome';
  else if(/Safari\//.test(ua)) browser = 'Safari';
  return { os, guessedType, browser };
}
/* Chromium's Client Hints API can report a platform version precise
   enough to tell Windows 10 from Windows 11 (classic navigator.userAgent
   reports both as "Windows NT 10.0"). Only Chrome/Edge/Opera support
   this — everywhere else the plain "Windows" guess above stands. */
async function refineOSName(){
  try{
    if(navigator.userAgentData && navigator.userAgentData.getHighEntropyValues){
      const hi = await navigator.userAgentData.getHighEntropyValues(['platformVersion']);
      if(hi.platform === 'Windows' && hi.platformVersion){
        const major = parseInt(hi.platformVersion.split('.')[0], 10);
        if(major >= 13) return 'Windows 11';
        if(major > 0) return 'Windows 10';
      }
    }
  }catch(e){}
  return null;
}
function formatRelativeDay(ts){
  const now = new Date();
  const d = new Date(ts);
  const startOfDay = (dt) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()).getTime();
  const diffDays = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
  const time = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  if(diffDays <= 0) return `Today · ${time}`;
  if(diffDays === 1) return `Yesterday · ${time}`;
  if(diffDays < 7) return `${diffDays} days ago · ${time}`;
  return d.toLocaleDateString() + ' · ' + time;
}
function recordLoginActivity(){
  const info = detectDeviceInfoSync();
  if(!Array.isArray(state.prefs.loginHistory)) state.prefs.loginHistory = [];
  state.prefs.loginHistory = [{ t: Date.now(), os: info.os, browser: info.browser }, ...state.prefs.loginHistory].slice(0, 10);
  state.prefs.lastActiveAt = Date.now();
}

/* ---------------- Password analysis engine ---------------- */
const COMMON_PASSWORDS = new Set([
  "123456","password","123456789","12345678","12345","1234567","1234567890","qwerty","abc123",
  "111111","123123","letmein","welcome","admin","iloveyou","monkey","dragon","football","master",
  "password1","1q2w3e4r","sunshine","princess","login","solo","passw0rd","starwars","freedom",
  "whatever","trustno1","ninja","azerty","000000","666666","121212","qazwsx","zaq12wsx","987654321",
  "1qaz2wsx","password123","charlie","donald","hunter2","superman","batman","michael","jennifer",
  "jordan","hannah","maggie","summer","tigger","shadow","matrix","asdfgh","asdf1234","p@ssw0rd",
  "letmein1","changeme","default","secret","test123","welcome1","google","apple123","admin123",
  "administrator","root","toor","guest","user","1234","12345678910","qwertyuiop","1q2w3e","zxcvbnm",
  "iloveyou1","cheese","football1","baseball","basketball","liverpool","chelsea","arsenal","abcd1234"
]);
const SEQ_SOURCES = ["abcdefghijklmnopqrstuvwxyz","0123456789","qwertyuiop","asdfghjkl","zxcvbnm"];

function log2(x){ return Math.log(x) / Math.log(2); }

function analyzePassword(pw, context){
  context = context || [];
  if(!pw) return {
    length:0, entropy:0, score:0, label:'—', crack:{}, feedback:[], charsetSize:0,
    hasLower:false, hasUpper:false, hasDigit:false, hasSymbol:false,
    estimatedCrackTime:'—', bruteForceTime:'—',
    varietyTypes:[], varietyCount:0,
    dictionaryRisk:'—', dictionaryColor:'var(--text-faint)', dictionaryTime:'—',
    repeatedCount:0, repeatedSamples:[], sequentialCount:0,
    commonMatch:false, contextMatch:false,
  };

  const hasLower = /[a-z]/.test(pw);
  const hasUpper = /[A-Z]/.test(pw);
  const hasDigit = /[0-9]/.test(pw);
  const hasSymbol = /[^a-zA-Z0-9]/.test(pw);

  let charsetSize = 0;
  if(hasLower) charsetSize += 26;
  if(hasUpper) charsetSize += 26;
  if(hasDigit) charsetSize += 10;
  if(hasSymbol) charsetSize += 33;
  if(charsetSize === 0) charsetSize = 1;

  let entropy = pw.length * log2(charsetSize);

  // Repeated character runs (aaa, 1111)
  const repeatMatches = pw.match(/(.)\1{2,}/g) || [];
  entropy -= repeatMatches.length * 6;

  // Sequential runs (abc, 123, qwerty…) length >= 3, forward or reverse
  const lower = pw.toLowerCase();
  let seqHits = 0;
  for(const source of SEQ_SOURCES){
    for(let i=0;i<=source.length-3;i++){
      const fwd = source.slice(i,i+3);
      const rev = fwd.split('').reverse().join('');
      if(lower.includes(fwd)) seqHits++;
      if(lower.includes(rev)) seqHits++;
    }
  }
  entropy -= seqHits * 5;

  // Common password / leaked-list match (exact or contained)
  let commonMatch = COMMON_PASSWORDS.has(lower);
  if(!commonMatch){
    for(const cp of COMMON_PASSWORDS){
      if(cp.length >= 5 && lower.includes(cp)){ commonMatch = true; break; }
    }
  }
  if(commonMatch) entropy = Math.min(entropy, 12);

  // Context reuse (e.g. contains the site name or username)
  let contextMatch = false;
  for(const c of context){
    if(c && c.length >= 3 && lower.includes(c.toLowerCase())) contextMatch = true;
  }
  if(contextMatch) entropy -= 12;

  entropy = Math.max(0, entropy);

  let label, color;
  if(commonMatch || entropy < 28){ label='Very Weak'; color='var(--red)'; }
  else if(entropy < 40){ label='Weak'; color='#fb923c'; }
  else if(entropy < 60){ label='Fair'; color='var(--amber)'; }
  else if(entropy < 80){ label='Strong'; color='var(--cyan)'; }
  else { label='Very Strong'; color='var(--green)'; }

  const score = Math.round(Math.min(100, (entropy/85)*100));

  function fmtTime(seconds){
    if(seconds < 1) return 'instantly';
    const units = [
      ['century',3153600000],['year',31536000],['month',2592000],['day',86400],
      ['hour',3600],['minute',60],['second',1]
    ];
    for(const [name,secs] of units){
      if(seconds >= secs){
        const val = seconds/secs;
        const rounded = val >= 100 ? Math.round(val).toLocaleString() : val.toFixed(1);
        return `${rounded} ${name}${val>=1.5?'s':''}`;
      }
    }
    return 'instantly';
  }
  const guesses = Math.pow(2, entropy) / 2;
  const crack = {
    'Online (throttled, 100/hr)': fmtTime(guesses / (100/3600)),
    'Offline, slow hash (10k/s)': fmtTime(guesses / 1e4),
    'Offline, GPU farm (10B/s)': fmtTime(guesses / 1e10),
  };
  // Headline "estimated crack time" uses a realistic offline-hash scenario;
  // "brute force time" reflects a well-resourced attacker with GPU hardware.
  const estimatedCrackTime = crack['Offline, slow hash (10k/s)'];
  const bruteForceTime = crack['Offline, GPU farm (10B/s)'];

  // Character variety
  const varietyTypes = [];
  if(hasLower) varietyTypes.push('Lowercase');
  if(hasUpper) varietyTypes.push('Uppercase');
  if(hasDigit) varietyTypes.push('Digits');
  if(hasSymbol) varietyTypes.push('Symbols');
  const varietyCount = varietyTypes.length;

  // Dictionary attack risk — how quickly a wordlist/mutation attack would find it
  let dictionaryRisk, dictionaryColor, dictionaryTime;
  if(commonMatch){
    dictionaryRisk = 'Very High Risk'; dictionaryColor = 'var(--red)'; dictionaryTime = 'Instantly';
  } else if(contextMatch){
    dictionaryRisk = 'High Risk'; dictionaryColor = 'var(--red)'; dictionaryTime = 'Minutes (guessable from context)';
  } else if(entropy < 35){
    dictionaryRisk = 'Medium Risk'; dictionaryColor = 'var(--amber)'; dictionaryTime = fmtTime(guesses / 1e4);
  } else if(entropy < 55){
    dictionaryRisk = 'Low Risk'; dictionaryColor = 'var(--cyan)'; dictionaryTime = 'Unlikely with common wordlists';
  } else {
    dictionaryRisk = 'Safe'; dictionaryColor = 'var(--green)'; dictionaryTime = 'Not vulnerable to common wordlists';
  }

  const feedback = [];
  if(pw.length < 12) feedback.push({ok:false, text:`Use at least 12 characters — currently ${pw.length}.`});
  else feedback.push({ok:true, text:'Meets the recommended 12-character minimum.'});
  if(!(hasLower && hasUpper)) feedback.push({ok:false, text:'Mix uppercase and lowercase letters.'});
  if(!hasDigit) feedback.push({ok:false, text:'Add at least one number.'});
  if(!hasSymbol) feedback.push({ok:false, text:'Add at least one symbol (e.g. !, #, %, @).'});
  if(repeatMatches.length) feedback.push({ok:false, text:'Avoid repeating the same character three or more times.'});
  if(seqHits) feedback.push({ok:false, text:'Avoid sequences like "abc", "123" or "qwerty".'});
  if(commonMatch) feedback.push({ok:false, text:'This password (or a close variant) appears on common leaked-password lists.'});
  if(contextMatch) feedback.push({ok:false, text:'Avoid reusing the site name or username inside the password.'});
  if(feedback.every(f=>f.ok) ) feedback.push({ok:true, text:'No common weaknesses detected.'});

  return {
    length: pw.length, entropy: Math.round(entropy), score, label, color, crack, feedback, charsetSize,
    hasLower, hasUpper, hasDigit, hasSymbol,
    estimatedCrackTime, bruteForceTime,
    varietyTypes, varietyCount,
    dictionaryRisk, dictionaryColor, dictionaryTime,
    repeatedCount: repeatMatches.length, repeatedSamples: repeatMatches,
    sequentialCount: seqHits,
    commonMatch, contextMatch,
  };
}

/* ---------------- Generator ---------------- */
function generatePassword(opts){
  let chars = '';
  const lower = 'abcdefghjkmnpqrstuvwxyz';
  const lowerAmb = 'ilo';
  const upper = 'ABCDEFGHJKMNPQRSTUVWXYZ';
  const upperAmb = 'ILO';
  const digits = '23456789';
  const digitsAmb = '01';
  const symbols = '!@#$%^&*()-_=+[]{}<>?';

  if(opts.lower) chars += lower + (opts.excludeAmbiguous ? '' : lowerAmb);
  if(opts.upper) chars += upper + (opts.excludeAmbiguous ? '' : upperAmb);
  if(opts.digits) chars += digits + (opts.excludeAmbiguous ? '' : digitsAmb);
  if(opts.symbols) chars += symbols;
  if(!chars) chars = lower;

  const len = opts.length;
  const arr = new Uint32Array(len);
  const result = [];
  const max = Math.floor(0xFFFFFFFF / chars.length) * chars.length;
  let i = 0;
  while(result.length < len){
    crypto.getRandomValues(arr);
    for(let j=0;j<arr.length && result.length<len;j++){
      if(arr[j] < max){ result.push(chars[arr[j] % chars.length]); }
    }
  }
  return result.join('');
}

/* ---------------- Breach check (HaveIBeenPwned, k-anonymity) ----------------
   Only the first 5 characters of the password's SHA-1 hash are ever sent
   over the network — the full password, and even the full hash, never
   leaves the device. This is the same technique HaveIBeenPwned's own
   client tooling recommends. */
async function sha1Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-1', enc);
  const bytes = new Uint8Array(buf);
  return Array.from(bytes).map(b => b.toString(16).padStart(2,'0')).join('').toUpperCase();
}
async function checkPwned(password){
  const hash = await sha1Hex(password);
  const prefix = hash.slice(0,5);
  const suffix = hash.slice(5);
  let res;
  try{
    res = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`);
  }catch(e){
    throw new Error('NETWORK');
  }
  if(!res.ok) throw new Error('API_ERROR');
  const text = await res.text();
  const lines = text.split('\n');
  for(const line of lines){
    const parts = line.trim().split(':');
    if(parts[0] === suffix) return parseInt(parts[1],10) || 0;
  }
  return 0;
}
function fmtCount(n){ return n >= 1000 ? Math.round(n/1000)+'k+' : String(n); }
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
/* The HTML `autofocus` attribute is ignored for inputs inserted via innerHTML,
   so after rendering a modal/screen we focus the intended input explicitly. */
function focusSoon(id){
  setTimeout(() => { const e = document.getElementById(id); if(e) e.focus(); }, 0);
}
/* Single source of truth for the "Last scanned" text in Settings, used by the
   initial render and by the in-place update after a breach scan finishes. */
function formatLastScanned(ts){
  return ts ? new Date(ts).toLocaleDateString() : 'Never';
}

  const el = document.getElementById('last-scanned-label');
  if(el) el.textContent = formatLastScanned(state.prefs.lastBreachScanAt);
}
async function runBreachScanAll(progressEl, resultsEl, btn){
  resultsEl.innerHTML = '';
  const loginEntries = state.entries.filter(e => (e.type||'login') === 'login');
  if(loginEntries.length === 0){ progressEl.textContent = 'No login entries to scan.'; return; }
  if(btn) btn.disabled = true;
  const flagged = [];
  let errors = 0;
  for(let i=0;i<loginEntries.length;i++){
    const entry = loginEntries[i];
    progressEl.textContent = `Scanning ${i+1} of ${loginEntries.length}: ${entry.title || 'Untitled'}…`;
    try{
      const count = await checkPwned(entry.password);
      if(count > 0) flagged.push({entry, count});
    }catch(e){ errors++; }
    if(i < loginEntries.length - 1) await sleep(250); // gentle pacing between requests
  }
  progressEl.textContent = `Scan complete — checked ${loginEntries.length - errors} of ${loginEntries.length} entries.${errors ? ' Some checks failed due to network issues.' : ''}`;
  if(flagged.length === 0){
    resultsEl.innerHTML = `<div class="settings-row" style="border:none;"><span style="color:var(--green); font-size:13px; font-weight:600;">${svgCheck(13)} No breached passwords found.</span></div>`;
  } else {
    resultsEl.innerHTML = `<div style="margin-top:6px; font-size:13px; color:var(--red); font-weight:600; margin-bottom:8px;">${svgAlert(13)} ${flagged.length} password${flagged.length>1?'s':''} found in known breaches:</div>` +
      flagged.map(f => `<div class="settings-row"><div class="settings-row-label">${esc(f.entry.title || 'Untitled')}</div><span class="badge" style="color:var(--red); background:rgba(251,113,133,0.12);">${fmtCount(f.count)} breaches</span></div>`).join('');
  }
  if(btn) btn.disabled = false;
  state.prefs.lastBreachScanAt = Date.now();

/* ---------------- TOTP / 2FA (RFC 6238, HMAC-SHA1 via Web Crypto) ---------------- */
function base32Decode(str){
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  const clean = (str||'').toUpperCase().replace(/[^A-Z2-7]/g,'');
  let bits = '';
  for(const c of clean){ bits += alphabet.indexOf(c).toString(2).padStart(5,'0'); }
  const bytes = [];
  for(let i=0;i+8<=bits.length;i+=8) bytes.push(parseInt(bits.substr(i,8),2));
  return new Uint8Array(bytes);
}
async function totpCode(secretB32, digits, timeStep, forTimeMs){
  digits = digits || 6; timeStep = timeStep || 30; forTimeMs = forTimeMs || Date.now();
  const keyBytes = base32Decode(secretB32);
  if(keyBytes.length === 0) throw new Error('BAD_SECRET');
  const counter = Math.floor(Math.floor(forTimeMs/1000) / timeStep);
  const buf = new ArrayBuffer(8);
  const view = new DataView(buf);
  view.setUint32(0, Math.floor(counter / 4294967296));
  view.setUint32(4, counter >>> 0);
  const cryptoKey = await crypto.subtle.importKey('raw', keyBytes, {name:'HMAC', hash:'SHA-1'}, false, ['sign']);
  const sigBuf = await crypto.subtle.sign('HMAC', cryptoKey, buf);
  const sig = new Uint8Array(sigBuf);
  const offset = sig[sig.length-1] & 0x0f;
  const binCode = ((sig[offset] & 0x7f) << 24) | ((sig[offset+1] & 0xff) << 16) | ((sig[offset+2] & 0xff) << 8) | (sig[offset+3] & 0xff);
  const mod = Math.pow(10, digits);
  return String(binCode % mod).padStart(digits, '0');
}
let totpInterval = null;
function startTotpTicker(){
  if(totpInterval) return;
  totpInterval = setInterval(async () => {
    const els = document.querySelectorAll('[data-totp-id]');
    for(const el of els){
      // Secret is looked up from state by entry id — never stored in the DOM.
      const owner = state.entries.find(x => x.id === el.dataset.totpId);
      const secret = owner ? owner.totpSecret : '';
      const codeEl = el.querySelector('[data-totp-code]');
      const barEl = el.querySelector('[data-totp-bar]');
      const remaining = 30 - (Math.floor(Date.now()/1000) % 30);
      if(barEl) barEl.style.width = ((remaining/30)*100) + '%';
      if(el.dataset.totpRevealed !== '1'){
        if(codeEl) codeEl.textContent = '••• •••';
        continue;
      }
      try{
        const code = await totpCode(secret);
        if(codeEl) codeEl.textContent = code.slice(0,3) + ' ' + code.slice(3);
      }catch(e){
        if(codeEl) codeEl.textContent = 'invalid key';
      }
    }
  }, 1000);
}
/* Builds an otpauth:// URI from a stored entry, for QR display/export. */
function buildOtpauthUri(entry){
  const issuer = entry.title || 'SecureSpace';
  const account = entry.username || entry.title || 'account';
  const label = encodeURIComponent(`${issuer}:${account}`);
  const params = new URLSearchParams({secret: entry.totpSecret, issuer, algorithm:'SHA1', digits:'6', period:'30'});
  return `otpauth://totp/${label}?${params.toString()}`;
}
/* Accepts either a full otpauth:// URI (what most sites' QR codes encode)
   or a raw base32 secret typed/scanned directly. */
function parseOtpauthOrSecret(text){
  text = (text||'').trim();
  if(/^otpauth:\/\//i.test(text)){
    try{
      const url = new URL(text);
      const secret = url.searchParams.get('secret');
      if(secret) return secret.toUpperCase().replace(/\s+/g,'');
    }catch(e){}
  }
  const clean = text.toUpperCase().replace(/[^A-Z2-7]/g,'');
  return clean || null;
}

/* ---------------- On-demand libraries (QR encode/decode) ----------------
   These are loaded from cdnjs only when a QR feature is actually used —
   never automatically, and never with any vault data in the request.
   The secret itself is only ever rendered/read locally in the browser;
   nothing about it is sent anywhere by loading the library code. */
let qrLibPromise = null;
function ensureQrLib(){
  if(window.QRCode) return Promise.resolve();
  if(qrLibPromise) return qrLibPromise;
  qrLibPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return qrLibPromise;
}
let jsQrLibPromise = null;
function ensureJsQrLib(){
  if(window.jsQR) return Promise.resolve();
  if(jsQrLibPromise) return jsQrLibPromise;
  jsQrLibPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return jsQrLibPromise;
}

/* ---------------- On-demand libraries (backup export: ZIP + PDF) ----------------
   Same on-demand-from-cdnjs approach as the QR libraries above: nothing
   loads until the matching export button is clicked, and only library
   code is fetched — your vault data never leaves the browser to get
   zipped or turned into a PDF. */
let jsZipLibPromise = null;
function ensureJsZipLib(){

}

/* ---------------- Export: encrypted ZIP ---------------- */
async function exportEncryptedZip(){

/* ---------------- Export: plaintext CSV ----------------
   Unlike every other export format, this file is NOT encrypted — it's
   a plain CSV of titles, usernames, passwords and URLs, formatted the
   way most password managers expect for import. It exists purely for
   moving to another tool; treat the downloaded file as sensitive and
   delete it once you're done. */
function csvEscape(val){
  const s = String(val==null ? '' : val);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function entriesToCSV(vaults){
  const headers = ['vault','type','category','title','username','password','url','totpSecret','tags','notes'];
  const rows = [headers.join(',')];
  (vaults||[]).forEach(v => {
    (v.entries||[]).forEach(e => {
      const row = [v.name, e.type||'login', e.category||'', e.title||'', e.username||'', e.password||'', e.url||'', e.totpSecret||'', e.tags||'', (e.notes||'').replace(/\r?\n/g,' ')];
      rows.push(row.map(csvEscape).join(','));
    });
  });
  return rows.join('\n');
}
async function exportCSV(){
  const csv = entriesToCSV(syncActiveVaultAndGetAll());
  const blob = new Blob([csv], {type:'text/csv'});
  downloadBlob(blob, `securespace-${state.username}-export-${Date.now()}.csv`);
  state.prefs.lastBackupAt = Date.now();
  await savePrefs(state.prefs);
}

/* ---------------- Export: PDF security report ----------------
   A health-check summary (weak / reused / stale passwords), never a
   credential dump — no plaintext passwords are ever placed in the PDF. */
async function exportSecurityReportPDF(){
  try{ await ensureJsPdfLib(); }
  catch(e){ showToast('Could not load the PDF library — check your connection'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const report = computeSecurityReport();
  let y = 18;
  doc.setFontSize(16); doc.text('SecureSpace Security Report', 14, y); y += 8;
  doc.setFontSize(10); doc.setTextColor(120);
  doc.text(`Account: @${state.username}   Generated: ${new Date().toLocaleString()}`, 14, y); y += 10;
  doc.setTextColor(0);
  doc.setFontSize(11);
  doc.text(`Total logins: ${report.total}    Weak: ${report.weak.length}    Reused: ${report.reused.length}    Expired: ${report.expired.length}    Expiring soon: ${report.expiringSoon.length}`, 14, y); y += 10;
  function section(title, rows){
    if(y > 265){ doc.addPage(); y = 18; }
    doc.setFontSize(13); doc.text(title, 14, y); y += 7;
    doc.setFontSize(10);
    if(rows.length === 0){ doc.text('None', 16, y); y += 9; return; }
    rows.forEach(r => {
      if(y > 280){ doc.addPage(); y = 18; }
      doc.text('- ' + r, 16, y); y += 6;
    });
    y += 6;
  }
  section('Weak passwords', report.weak.map(w => `${w.entry.title || 'Untitled'} (${w.result.label})`));
  section('Reused passwords', report.reused.map(g => `${g.map(e=>e.title||'Untitled').join(', ')} share a password`));
  section('Expired passwords', report.expired.map(o => `${o.entry.title || 'Untitled'} (${o.days} days old, expired ${Math.abs(o.status.daysLeft)}d ago)`));
  section('Expiring soon', report.expiringSoon.map(o => `${o.entry.title || 'Untitled'} (${o.days} days old, expires in ${o.status.daysLeft}d)`));
  if(y > 285){ doc.addPage(); y = 18; }
  doc.setFontSize(8); doc.setTextColor(150);
  doc.text('This report lists which entries need attention. It never includes plaintext passwords.', 14, Math.min(y+4, 290));
  doc.save(`securespace-${state.username}-report-${Date.now()}.pdf`);
}

function faviconURL(url){
  if(!url) return null;
  try{
    let u = url.trim();
    if(!u) return null;
    if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
    const domain = new URL(u).hostname;

  }catch(e){ return null; }
}

function normalizeDomain(u){
  if(!u) return '';
  try{
    let s = u.trim();
    if(!s) return '';
    if(!/^https?:\/\//i.test(s)) s = 'https://' + s;
    return new URL(s).hostname.replace(/^www\./,'').toLowerCase();
  }catch(e){ return u.trim().toLowerCase().replace(/^www\./,''); }
}
function matchKnownService(entryLike){
  const domain = normalizeDomain(entryLike.url||'');
  if(domain){
    const hit = KNOWN_SERVICES.find(s => s.domains.some(d => domain === d || domain.endsWith('.'+d)));
    if(hit) return hit;
  }
  const title = (entryLike.title||'').trim().toLowerCase();
  if(title){
    const hit = KNOWN_SERVICES.find(s => s.name.toLowerCase() === title);
    if(hit) return hit;
  }
  return null;
}
function serviceGlyphSVG(service){
  return `<svg width="100%" height="100%" viewBox="0 0 24 24">${service.glyph}</svg>`;
}
function serviceBadgeHTML(service, sizePx){
  sizePx = sizePx || 38;
  return `<div style="width:${sizePx}px;height:${sizePx}px;border-radius:${Math.round(sizePx*0.24)}px;background:${service.bg};display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:1px solid rgba(255,255,255,0.06);">${serviceGlyphSVG(service)}</div>`;
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg, icon){
  const el = document.getElementById('toast');
  el.innerHTML = `${icon || svgCheck()} <span>${esc(msg)}</span>`;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> el.classList.remove('show'), 2400);
}
function showToastPersist(msg, icon){
  const el = document.getElementById('toast');
  el.innerHTML = `${icon || svgCheck()} <span>${esc(msg)}</span>`;
  el.classList.add('show');
  clearTimeout(showToast._t);
}
function hideToast(){
  document.getElementById('toast').classList.remove('show');
}
let clipboardClearTimer = null;
function copyToClipboard(text, label){
  navigator.clipboard.writeText(text).then(()=>{
    let remaining = 20;
    const tick = () => showToastPersist(`${label || 'Value'} copied — clears in ${remaining}s`);
    tick();
    clearInterval(clipboardClearTimer); // a newer copy replaces any pending clear
    const iv = clipboardClearTimer = setInterval(() => {
      remaining--;
      if(remaining <= 0){
        clearInterval(iv);
        navigator.clipboard.writeText('').catch(()=>{});
        showToast(`${label || 'Value'} cleared from clipboard`);
        return;
      }
      tick();
    }, 1000);
  }).catch(()=> showToast('Could not copy — copy it manually'));
}
/* Copies the username first, then automatically switches the clipboard
   to the password a few seconds later — enough time to alt-tab and
   paste the username into a login form. */
function copyUsernameThenPassword(entry){
  navigator.clipboard.writeText(entry.username || '').then(()=>{
    let remaining = 4;
    const tick = () => showToastPersist(`Username copied — password copies in ${remaining}s`);
    tick();
    clearInterval(clipboardClearTimer);
    const iv = clipboardClearTimer = setInterval(() => {
      remaining--;
      if(remaining <= 0){
        clearInterval(iv);
        copyToClipboard(entry.password, 'Password');
        return;
      }
      tick();
    }, 1000);
  }).catch(()=> showToast('Could not copy — copy it manually'));
}

/* ---------------- Reveal PIN (defense in depth) ----------------
   A second, separate PIN that gates showing or copying any stored
   password, TOTP code, or custom field, plus opening the edit form
   for an entry (which also displays the plaintext password). This
   is NOT a second encryption layer — it doesn't add cryptographic
   strength, and anyone reading storage directly bypasses it
   entirely. It only adds a deliberate click-through step so a
   glance at an unlocked, unattended screen can't casually reveal
   every credential in one click. */
async function hashPin(pin, saltB64){
  const enc = new TextEncoder().encode(pin + ':' + saltB64);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return bufToB64(buf);
}
async function verifyRevealPin(pin){
  if(!state.prefs.revealPinHash || !state.prefs.revealPinSalt) return true;
  const h = await hashPin(pin, state.prefs.revealPinSalt);
  return h === state.prefs.revealPinHash;
}
function requireRevealPin(callback){
  if(!state.prefs.revealPinHash){ callback(); return; }
  if(state.revealUnlockUntil && Date.now() < state.revealUnlockUntil){ callback(); return; }
  openRevealPinModal(callback);
}
/* Exports (JSON/ZIP/CSV/PDF downloads) always require a PIN — separate
   from the master password used to unlock the vault — before the file
   is generated. If no reveal PIN has been set up yet, the setup modal
   opens first instead of silently letting the export through. */
function requireExportAuth(callback){
  if(!state.prefs.revealPinHash){
    showToast('Set up an export PIN first — it also protects revealing entries');
    openRevealPinSetupModal(callback);
    return;
  }
  requireRevealPin(callback);
}
function openRevealPinModal(onSuccess){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="pin-overlay">
      <div class="modal" style="max-width:320px;">
        <div class="modal-head"><h3>Enter reveal PIN</h3><button class="icon-btn" id="pin-close">${svgX(16)}</button></div>
        <p style="font-size:12.5px;color:var(--text-faint);margin-bottom:14px;">A second PIN, separate from your master password, before this value is shown.</p>
        <div id="pin-error" class="lock-error" style="display:none;"></div>
        <form id="pin-form">
          <div class="field"><input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" placeholder="••••" autofocus></div>
          <button type="submit" class="btn btn-primary btn-block">Unlock</button>
        </form>
      </div>
    </div>`;
  focusSoon('pin-input');
  const close = () => { root.innerHTML = ''; };
  document.getElementById('pin-close').onclick = close;
  document.getElementById('pin-overlay').addEventListener('click',(e)=>{ if(e.target.id==='pin-overlay') close(); });
  document.getElementById('pin-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const pin = document.getElementById('pin-input').value;
    const ok = await verifyRevealPin(pin);
    if(ok){
      state.revealUnlockUntil = Date.now() + 5*60000;
      close();
      onSuccess();
    } else {
      const err = document.getElementById('pin-error');
      err.textContent = 'Incorrect PIN.';
      err.style.display = 'block';
    }
  });
}
function openRevealPinSetupModal(onSaved){
  const root = document.getElementById('modal-root');
  const enabled = !!state.prefs.revealPinHash;
  root.innerHTML = `
    <div class="modal-overlay" id="pinsetup-overlay">
      <div class="modal" style="max-width:360px;">
        <div class="modal-head"><h3>${enabled?'Change reveal PIN':'Set up reveal PIN'}</h3><button class="icon-btn" id="pinsetup-close">${svgX(16)}</button></div>
        <p style="font-size:12.5px;color:var(--text-faint);margin-bottom:14px;">This PIN is a friction step, not real encryption — it doesn't protect your data if someone extracts it directly from storage. It only stops a quick glance at an unlocked screen.</p>
        ${enabled ? `<div class="field"><label>Current PIN</label><input type="password" id="pin-current" inputmode="numeric"></div>` : ''}
        <div class="field"><label>New PIN (4–8 digits)</label><input type="password" id="pin-new" inputmode="numeric"></div>
        <div class="field"><label>Confirm new PIN</label><input type="password" id="pin-new2" inputmode="numeric"></div>
        <div id="pinsetup-error" class="lock-error" style="display:none;"></div>
        <div class="modal-actions">
          ${enabled ? `<button type="button" class="btn btn-danger" id="pin-disable-btn" style="flex:1;">Disable</button>` : ''}
          <button type="button" class="btn btn-primary" id="pin-save-btn" style="flex:1;">${enabled?'Update PIN':'Enable PIN'}</button>
        </div>
      </div>
    </div>`;
  focusSoon(enabled ? 'pin-current' : 'pin-new');
  const close = () => { root.innerHTML = ''; };
  document.getElementById('pinsetup-close').onclick = close;
  document.getElementById('pinsetup-overlay').addEventListener('click',(e)=>{ if(e.target.id==='pinsetup-overlay') close(); });

  document.getElementById('pin-save-btn').onclick = async () => {
    const errEl = document.getElementById('pinsetup-error');
    errEl.style.display = 'none';
    if(enabled){
      const cur = document.getElementById('pin-current').value;
      if(!(await verifyRevealPin(cur))){ errEl.textContent = 'Current PIN is incorrect.'; errEl.style.display='block'; return; }
    }
    const n1 = document.getElementById('pin-new').value;
    const n2 = document.getElementById('pin-new2').value;
    if(!/^\d{4,8}$/.test(n1)){ errEl.textContent = 'PIN must be 4–8 digits.'; errEl.style.display='block'; return; }
    if(n1 !== n2){ errEl.textContent = 'PINs do not match.'; errEl.style.display='block'; return; }
    const salt = bufToB64(randomBytes(16));
    state.prefs.revealPinSalt = salt;
    state.prefs.revealPinHash = await hashPin(n1, salt);
    state.revealUnlockUntil = Date.now() + 5*60000;
    await savePrefs(state.prefs);
    showToast('Reveal PIN saved');
    close();
    renderMain();
    if(onSaved) onSaved();
  };
  const disableBtn = document.getElementById('pin-disable-btn');
  if(disableBtn){
    disableBtn.onclick = async () => {
      const cur = document.getElementById('pin-current').value;
      if(!(await verifyRevealPin(cur))){
        const errEl = document.getElementById('pinsetup-error');
        errEl.textContent = 'Current PIN is incorrect.'; errEl.style.display='block'; return;
      }
      state.prefs.revealPinHash = null;
      state.prefs.revealPinSalt = null;
      state.revealUnlockUntil = 0;
      await savePrefs(state.prefs);
      showToast('Reveal PIN disabled');
      close();
      renderMain();
    };
  }
}
